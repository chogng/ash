<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Collaboration panel integration</title>
		<style>
			body { margin: 0; }
			#app { width: min(360px, 100vw); height: 100vh; position: relative; color: var(--ash-foreground); background: var(--ash-sideBar-background); }
			#title { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; }
			#title h1 { margin: 0; font-size: 13px; font-weight: 600; }
			#panes { display: flex; flex-direction: column; height: calc(100% - 44px); min-height: 0; }
		</style>
	</head>
	<body>
		<main id="app" class="ash-workbench">
			<header id="title"><h1></h1><div id="title-actions"></div></header>
			<div id="panes"></div>
		</main>
		<script type="module" src="./collaboration.page.ts"></script>
	</body>
</html>
