[build]
target-dir = ".build/cargo"

[target.'cfg(target_os = "macos")']
# libwebrtc's Objective-C categories must be retained by final product/test linkers.
rustflags = ["-C", "link-arg=-ObjC"]

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

[env]
RUSTY_V8_MIRROR = { value = "third_party/.cache/v8", relative = true }
