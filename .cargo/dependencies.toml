name = "base64"
versions = ["0.13.1", "0.21.7", "0.22.1", "0.23.1"]
reason = "0.13 via spm_precompiled; 0.21 via LiveKit signaling and pbjson; 0.22 via application APIs and rtc-stun; 0.23 via rmcp and rtc-shared -> rcgen -> pem 4."

