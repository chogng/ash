# Dependency structure and duplicate versions remain owned by dependencies.py.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Reviewed 2026-10-11: these IDs report maintenance status, not a known
# vulnerability. Keep the published consumer APIs instead of vendoring their
# source trees solely to replace transitive dependencies. New advisories remain
# checked; remove each exception when a compatible upstream release drops it.
ignore = [
    # Build-time macros in Ratatui, tokenizers, V8, biblatex and hayagriva.
    "RUSTSEC-2024-0436", # paste
    # BM25 hashes the rebuilt in-memory tool index; IDs are not persisted.
    "RUSTSEC-2025-0057", # fxhash
    # Syntect's published syntax loader; custom YAML remains covered by Typst tests.
    "RUSTSEC-2024-0320", # yaml-rust
    # Syntect's published syntax/theme dump format and bundled assets.
    "RUSTSEC-2025-0141", # bincode
    # Typst/usvg font shaping and parsing; follow their upstream migration together.
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
]

[licenses]
# Derived from Ash's resolved third-party graph, including conjunctive licenses.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# Ash's unpublished proprietary packages are not third-party SPDX dependencies.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/cobalt-org/liquid-rust",
    "https://github.com/dzbarsky/rules_rust",
    "https://github.com/helix-editor/nucleo.git",
    "https://github.com/hyperium/h3",
    "https://github.com/typst/citationberg",
]
