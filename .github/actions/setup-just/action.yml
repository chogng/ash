name: Set up repository Just
description: Install the Just version shared by local formatting and CI.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version="$(cat .just-version)"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'tool=just@%s\n' "$version" >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: ${{ steps.version.outputs.tool }}
