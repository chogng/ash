name: PSEC Windows 11 25H2 x64 acceptance

on:
  push:
    branches: [codex/windows-x64-psec-vm-20261104]
    paths: [".github/workflows/psec-client-x64-vm.yml"]

permissions: {}

jobs:
  client-x64:
    name: Windows 11 25H2 x64 PSEC positive
    runs-on: [self-hosted, Windows, X64, ash-psec-x64-25h2-20261104]
    timeout-minutes: 20
    steps:
      - name: Run the acceptance kit
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".build/acceptance/psec-client-x64/$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $env:ASH_PSEC_REPORT_DIR = Join-Path $root 'suite'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -LiteralPath 'C:\psec-probe.json' -Destination $root
          $inventory = Get-Content -Raw -LiteralPath 'C:\psec-probe.json' | ConvertFrom-Json
          $inventory | ConvertTo-Json -Depth 6
          $runningBuild = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          if ($runningBuild.DisplayVersion -ne $inventory.build.DisplayVersion -or $runningBuild.CurrentBuild -ne $inventory.build.CurrentBuild -or $runningBuild.UBR -ne $inventory.build.UBR) {
            throw 'The current Windows build does not match the recorded probe'
          }
          if ($inventory.architecture -ne 'X64' -or $inventory.build.DisplayVersion -ne '25H2' -or $inventory.psec.status -ne 'advertised') {
            throw 'Expected Windows 11 25H2 x64 with advertised PSEC'
          }
          $volume = Get-Volume -FileSystemLabel ASHPSECKIT
          $test = Join-Path ($volume.DriveLetter + ':\') 'run.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File $test
          $testExit = $LASTEXITCODE
          Copy-Item -LiteralPath 'C:\psec-followup\manifest.json' -Destination $root
          Get-Content -LiteralPath (Join-Path $env:ASH_PSEC_REPORT_DIR 'tests.log')
          $summary = Get-Content -Raw -LiteralPath (Join-Path $env:ASH_PSEC_REPORT_DIR 'summary.json') | ConvertFrom-Json
          $summary | ConvertTo-Json -Depth 8
          if ($testExit -ne 0 -or $summary.status -ne 'passed' -or $summary.tests.Count -ne 22 -or $summary.commit -ne $env:GITHUB_SHA) {
            throw 'The Windows client x64 acceptance kit did not complete successfully'
          }
      - name: Upload Windows 11 25H2 x64 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: psec-client-x64-25h2-attempt-${{ github.run_attempt }}
          path: .build/acceptance/psec-client-x64/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
