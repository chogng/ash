name: Dependency security

on:
  workflow_call:
  workflow_dispatch:
  # Advisory data changes independently of repository commits.
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Cargo dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned dependency security checker
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses and sources
        run: python3 -B scripts/dependency_security.py
