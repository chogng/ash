name: Build tooling

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'scripts/**'
      - 'app-rs/packaging/**'
      - 'third_party/**'
      - 'resources/**'
      - 'extensions/**'
      - 'ash-rs/skills/assets/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - '.nvmrc'
      - 'rust-toolchain.toml'
      - 'justfile'
      - '.github/workflows/tooling.yml'
  pull_request:
    paths:
      - 'build/**'
      - 'scripts/**'
      - 'app-rs/packaging/**'
      - 'third_party/**'
      - 'resources/**'
      - 'extensions/**'
      - 'ash-rs/skills/assets/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - '.nvmrc'
      - 'rust-toolchain.toml'
      - 'justfile'
      - '.github/workflows/tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: uv,just
      - name: Check Python lint
        run: just lint
      - name: Check Python format
        run: uv run --frozen --project scripts ruff format --check build scripts
      - name: Test build, package, signing and repository contracts
        run: just test-python build scripts code
