name: V8 security checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  consumers:
    name: Runtime policy and pinned artifacts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    env:
      # First-isolate sandbox pool initialization must be serialized.
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-just
      - name: Verify runtime mitigation and optimized sort regression
        shell: bash
        run: |
          just verify ash-v8-runtime
          just verify ash-v8-poc --features sandbox

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate source and consumer versions
        run: python3 -B build/v8/release.py metadata
