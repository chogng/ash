name: Media integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Prepare the locked LiveKit Server
        run: |
          python -B build/lib/livekit.py "${{ matrix.target }}" > "$RUNNER_TEMP/livekit.json"
          echo "ASH_TEST_LIVEKIT_SERVER=$(node -p 'require(process.argv[1]).executable' "$RUNNER_TEMP/livekit.json")" >> "$GITHUB_ENV"
      - name: Check media packages
        run: python -B scripts/cargo.py check --locked -p ash-livekit-client -p ash-screen-capture -p ash-voice-agent
      - name: Build the collaboration service
        run: |
          python -B scripts/cargo.py build --locked -p ash-collab-server --bin ash-collab-server
          echo "ASH_TEST_COLLABORATION_SERVER=$(node -p 'require("node:path").resolve(".build/cargo/debug/ash-collab-server.exe")')" >> "$GITHUB_ENV"
      - name: Build local room and recognition programs separately
        run: |
          python -B scripts/cargo.py build --locked -p ash-livekit-client --bin ash-livekit-client --features host
          python -B scripts/cargo.py build --locked -p ash-realtime-voice --bin ash-realtime-voice --features host
          echo "ASH_LIVEKIT_CLIENT_PATH=$(node -p 'require("node:path").resolve(".build/cargo/debug/ash-livekit-client.exe")')" >> "$GITHUB_ENV"
          echo "ASH_RECOGNIZER_PATH=$(node -p 'require("node:path").resolve(".build/cargo/debug/ash-realtime-voice.exe")')" >> "$GITHUB_ENV"
      - name: Test local room and recognition process contracts
        run: |
          python -B scripts/cargo.py test --locked -p ash-livekit-client --features host --lib --test process --test room --test rooms --test channels -- --include-ignored --test-threads=1
          python -B scripts/cargo.py test --locked -p ash-realtime-voice --features host
      - name: Test rooms, authority and model bridge against the real server
        # Each room test runs a real media server and a CPU video/audio pipeline.
        # Keep their time-based transport assertions independent of other rooms.
        run: python -B scripts/cargo.py test --locked -p ash-livekit-api -p ash-call -p ash-collab-server -p ash-voice-agent --features ash-call/runtime -- --include-ignored --test-threads=1
      - name: Test screen capture contracts
        run: python -B scripts/cargo.py test --locked -p ash-screen-capture
      - name: Test speech processing
        run: python -B scripts/cargo.py test --locked -p ash-voice-host --features host
      - name: Reject warnings in media packages and tests
        run: python -B scripts/cargo.py --deny-warnings check --locked -p ash-livekit-client -p ash-screen-capture -p ash-call -p ash-voice-agent -p ash-voice-host -p ash-realtime-voice --features ash-call/runtime,ash-voice-host/host,ash-livekit-client/host,ash-realtime-voice/host --all-targets

  server-build:
    name: LiveKit ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for the macOS media server build
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Prepare and run the server
        shell: bash
        run: |
          python -B build/lib/livekit.py "${{ matrix.target }}" > "$RUNNER_TEMP/livekit.json"
          server=$(node -p 'require(process.argv[1]).executable' "$RUNNER_TEMP/livekit.json")
          version=$(node -p 'require("./third_party/livekit/runtime-lock.json").version')
          test "$("$server" --version)" = "livekit-server version $version"

      - name: Check screen capture platform and test targets
        run: python -B scripts/cargo.py --deny-warnings check --locked -p ash-screen-capture --all-targets
