name: Media integration

on:
  push:
    branches: [main]
    paths: &media-paths
      - "ash-rs/livekit-client/**"
      - "ash-rs/screen-capture/**"
      - "ash-rs/vendor/livekit-rust-sdks/**"
      - "ash-rs/http-client/**"
      - "ash-rs/websocket-client/**"
      - "ash-rs/livekit-api/**"
      - "ash-rs/voice-agent/**"
      - "ash-rs/voice-host/**"
      - "ash-rs/app-server/src/server/call*"
      - "build/package/livekit.ts"
      - "third_party/livekit/**"
      - "ash-rs/call/**"
      - "ash-rs/collaboration-server/**"
      - "ash-rs/model-provider/**"
      - "ash-rs/model-provider-config/**"
      - "ash-rs/ash-api/**"
      - "ash-rs/websocket-client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "scripts/cargo.py"
      - "build/lib/**"
      - "build/download/**"
      - "justfile"
      - ".github/workflows/media.yml"
  pull_request:
    paths: *media-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Prepare the locked LiveKit Server
        run: |
          node build/package/livekit.ts x86_64-pc-windows-msvc > "$RUNNER_TEMP/livekit.json"
          echo "ASH_TEST_LIVEKIT_SERVER=$(node -p 'require(process.argv[1]).executable' "$RUNNER_TEMP/livekit.json")" >> "$GITHUB_ENV"
      - name: Test Rust SDK patches
        run: |
          python ash-rs/vendor/livekit-rust-sdks/verify.py
          python -B scripts/cargo.py test --locked --manifest-path ash-rs/vendor/livekit-rust-sdks/Cargo.toml -p livekit-signaling --lib
          python -B scripts/cargo.py test --locked --manifest-path ash-rs/vendor/livekit-rust-sdks/Cargo.toml -p webrtc-sys --lib rtc_error
      - name: Check media packages
        run: python -B scripts/cargo.py check --locked -p ash-livekit-client -p ash-voice-agent
      - name: Build the collaboration service
        run: |
          python -B scripts/cargo.py build --locked -p ash-collaboration-server --bin ash-collaboration-server
          echo "ASH_TEST_COLLABORATION_SERVER=$(node -p 'require("node:path").resolve(".build/cargo/debug/ash-collaboration-server.exe")')" >> "$GITHUB_ENV"
      - name: Test rooms, authority and model bridge against the real server
        run: python -B scripts/cargo.py test --locked -p ash-livekit-client -p ash-livekit-api -p ash-call -p ash-collaboration-server -p ash-voice-agent --features ash-call/runtime -- --include-ignored
      - name: Test speech processing
        run: python -B scripts/cargo.py test --locked -p ash-voice-host --features host --lib
      - name: Reject warnings in media packages and tests
        run: python -B scripts/cargo.py --deny-warnings check --locked -p ash-livekit-client -p ash-voice-agent -p ash-voice-host --features ash-voice-host/host --all-targets

  server-build:
    name: LiveKit ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for the macOS media server build
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Prepare and run the server
        shell: bash
        run: |
          node build/package/livekit.ts "${{ matrix.target }}" > "$RUNNER_TEMP/livekit.json"
          server=$(node -p 'require(process.argv[1]).executable' "$RUNNER_TEMP/livekit.json")
          version=$(node -p 'require("./third_party/livekit/runtime-lock.json").version')
          test "$("$server" --version)" = "livekit-server version $version"
