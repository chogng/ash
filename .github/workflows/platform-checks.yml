name: Platform checks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sandbox_only:
        description: "Run only macOS sandbox acceptance"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox-macos:
    name: macOS sandbox (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          override: false
          rustflags: ""
      - name: Test macOS sandbox and PTY boundaries
        run: python3 -B scripts/cargo.py test -p ash-mxc-sandbox --lib --test pty --locked --target "${{ matrix.target }}" -- --test-threads=1

  sanity:
    # Both platform checks and release builds must pass before verifying uploaded packages.
    needs: [check, sandbox-macos, build-windows]
    if: github.event_name == 'release'
    uses: ./.github/workflows/release-sanity.yml
    with:
      product: all
      version: ${{ github.event.release.tag_name }}
      source: pipeline

  publish:
    needs: sanity
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-packages-*
          path: .build/release-artifacts
          merge-multiple: true
      - name: Publish verified packages and signed update descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .build/release-artifacts/* --repo "$GITHUB_REPOSITORY"

  build-windows:
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-windows.yml
    secrets:
      ASH_UPDATE_SIGNING_KEY: ${{ secrets.ASH_UPDATE_SIGNING_KEY }}

  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.sandbox_only
    name: ${{ matrix.target }} (${{ matrix.runner }})
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            python: python3
            archive: zip
            update_format: zip
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            python: python3
            archive: zip
            update_format: zip
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
            archive: tar.gz
            update_format: tar-gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
            archive: tar.gz
            update_format: tar-gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
            archive: tar.gz
            update_format: tar-gz
            release_package: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
            archive: tar.gz
            update_format: tar-gz
            release_package: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for the macOS media server build
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Windows ARM64 Rust target
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Check app target
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py check -p app --all-targets --target "${{ matrix.target }}"

      - name: Test platform packaging contracts
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py test -p zui --lib distribution::tests --target "${{ matrix.target }}"

      - name: Test Ash Code tooling
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py code

      - name: Set up Node and pnpm for package contract tests
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false

      - name: Test build tooling
        shell: bash
        run: ${{ matrix.python }} -B scripts/test-python.py build

      - name: Verify App Server protocol artifacts
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py test -p ash-app-server-protocol --lib tests::schema_fixtures_match_the_generators --locked --target "${{ matrix.target }}" -- --exact

      - name: Test Linux managed network boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ${{ matrix.python }} -B scripts/cargo.py build -p ash-network-proxy --example probe --target "${{ matrix.target }}"
          export ASH_NETWORK_PROBE="$GITHUB_WORKSPACE/.build/cargo/${{ matrix.target }}/debug/examples/probe"
          ${{ matrix.python }} -B scripts/cargo.py test -p ash-mxc-sandbox --lib --target "${{ matrix.target }}"
          ${{ matrix.python }} -B scripts/cargo.py test -p ash-mxc-sandbox --test linux --target "${{ matrix.target }}" -- --ignored

      - name: Test Windows account execution and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.python }} -B scripts/cargo.py test -p ash-mxc-sandbox --lib --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-sandbox.ps1 -Target "${{ matrix.target }}"

      - name: Build Ash Code release package
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        env:
          ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
        run: |
          version="$(${{ matrix.python }} -c 'from build.lib.version import read_workspace_version; from pathlib import Path; print(read_workspace_version(Path("Cargo.toml")))')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${#ASH_UPDATE_PUBLIC_KEY}" = 64
          ${{ matrix.python }} -B scripts/cargo.py build --package ash-cli --bin ash --profile release --target "${{ matrix.target }}"
          cli=".build/cargo/${{ matrix.target }}/release/ash"
          runtime=".build/releases/runtime-${{ matrix.target }}"
          package=".build/releases/ash-code-${{ matrix.target }}"
          ${{ matrix.python }} -B build/app_server.py \
            --target "${{ matrix.target }}" \
            --package-dir "$runtime"
          ${{ matrix.python }} -B build/code/package.py \
            --runtime-package "$runtime" \
            --cli-bin "$cli" \
            --update-public-key "$ASH_UPDATE_PUBLIC_KEY" \
            --package-dir "$package"
          ${{ matrix.python }} -B scripts/cargo.py build --package ash-update-sign --bin ash-update-sign

      - name: Verify bundled search through App Server RPC
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        run: |
          ${{ matrix.python }} -B build/search_smoke.py \
            --package-dir ".build/releases/ash-code-${{ matrix.target }}" \
            --report ".build/releases/search-smoke-${{ matrix.target }}.json"

      - name: Import macOS release credentials
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ASH_MACOS_CERTIFICATE_P12: ${{ secrets.ASH_MACOS_CERTIFICATE_P12 }}
          ASH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ASH_MACOS_CERTIFICATE_PASSWORD }}
          ASH_MACOS_NOTARY_KEY_P8: ${{ secrets.ASH_MACOS_NOTARY_KEY_P8 }}
          ASH_MACOS_NOTARY_KEY_ID: ${{ secrets.ASH_MACOS_NOTARY_KEY_ID }}
          ASH_MACOS_NOTARY_ISSUER: ${{ secrets.ASH_MACOS_NOTARY_ISSUER }}
        run: |
          test -n "$ASH_MACOS_CERTIFICATE_P12"
          test -n "$ASH_MACOS_CERTIFICATE_PASSWORD"
          test -n "$ASH_MACOS_NOTARY_KEY_P8"
          test -n "$ASH_MACOS_NOTARY_KEY_ID"
          test -n "$ASH_MACOS_NOTARY_ISSUER"
          signing_dir="$RUNNER_TEMP/ash-signing"
          mkdir -p "$signing_dir"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ash-signing", "certificate.p12").write_bytes(base64.b64decode(os.environ["ASH_MACOS_CERTIFICATE_P12"], validate=True)); pathlib.Path(os.environ["RUNNER_TEMP"], "ash-signing", "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ASH_MACOS_NOTARY_KEY_P8"], validate=True))'
          keychain="$signing_dir/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$ASH_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          login_keychain="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "$login_keychain"
          xcrun notarytool store-credentials ash-release \
            --key "$signing_dir/AuthKey.p8" \
            --key-id "$ASH_MACOS_NOTARY_KEY_ID" \
            --issuer "$ASH_MACOS_NOTARY_ISSUER"
          echo "ASH_MACOS_NOTARY_PROFILE=ash-release" >> "$GITHUB_ENV"

      - name: Apply system signatures
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ASH_MACOS_SIGNING_IDENTITY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY }}
        run: |
          ${{ matrix.python }} -B build/sign.py \
            --package-dir ".build/releases/ash-code-${{ matrix.target }}" \
            --target "${{ matrix.target }}"
          ${{ matrix.python }} -B build/sign.py \
            --package-dir ".build/releases/runtime-${{ matrix.target }}" \
            --target "${{ matrix.target }}"

      - name: Build Code and App Server release archives
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        run: |
          ${{ matrix.python }} -B build/code/archive.py \
            --package-dir ".build/releases/ash-code-${{ matrix.target }}" \
            --output ".build/releases/ash-code-${{ matrix.target }}.${{ matrix.archive }}"
          ${{ matrix.python }} -B build/code/archive.py \
            --product ash-app-server \
            --package-dir ".build/releases/runtime-${{ matrix.target }}" \
            --output ".build/releases/ash-app-server-${{ matrix.target }}.${{ matrix.archive }}"

      - name: Notarize macOS release archives
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        run: |
          ${{ matrix.python }} -B build/darwin/notarize.py \
            ".build/releases/ash-code-${{ matrix.target }}.${{ matrix.archive }}"
          ${{ matrix.python }} -B build/darwin/notarize.py \
            ".build/releases/ash-app-server-${{ matrix.target }}.${{ matrix.archive }}"

      - name: Sign Code and App Server updates
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        env:
          ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
          ASH_UPDATE_SIGNING_KEY: ${{ secrets.ASH_UPDATE_SIGNING_KEY }}
        run: |
          signer=".build/cargo/debug/ash-update-sign"
          "$signer" \
            --repository chogng/ash \
            --product ash-code \
            --channel latest \
            --version "${GITHUB_REF_NAME#v}" \
            --release-tag "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}" \
            --format "${{ matrix.update_format }}" \
            --archive ".build/releases/ash-code-${{ matrix.target }}.${{ matrix.archive }}" \
            --output ".build/releases/ash-code-${{ matrix.target }}.update.json" \
            --public-key "$ASH_UPDATE_PUBLIC_KEY"
          "$signer" \
            --repository chogng/ash \
            --product ash-app-server \
            --channel latest \
            --version "${GITHUB_REF_NAME#v}" \
            --release-tag "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}" \
            --format "${{ matrix.update_format }}" \
            --archive ".build/releases/ash-app-server-${{ matrix.target }}.${{ matrix.archive }}" \
            --output ".build/releases/ash-app-server-${{ matrix.target }}.update.json" \
            --public-key "$ASH_UPDATE_PUBLIC_KEY"

      - name: Stage Code and App Server release packages
        if: github.event_name == 'release' && matrix.release_package != false
        shell: bash
        run: |
          mkdir -p ".build/release-artifacts/${{ matrix.target }}"
          cp \
            ".build/releases/ash-code-${{ matrix.target }}.${{ matrix.archive }}" \
            ".build/releases/ash-code-${{ matrix.target }}.${{ matrix.archive }}.sha256" \
            ".build/releases/ash-code-${{ matrix.target }}.update.json" \
            ".build/releases/ash-app-server-${{ matrix.target }}.${{ matrix.archive }}" \
            ".build/releases/ash-app-server-${{ matrix.target }}.${{ matrix.archive }}.sha256" \
            ".build/releases/ash-app-server-${{ matrix.target }}.update.json" \
            ".build/release-artifacts/${{ matrix.target }}/"

      - name: Install Desktop packaging dependencies
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Package and verify macOS Desktop
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ASH_MACOS_SIGNING_IDENTITY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY }}
          ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
        run: pnpm run package:desktop:darwin

      - name: Notarize and stage macOS Desktop
        if: github.event_name == 'release' && matrix.release_package != false && runner.os == 'macOS'
        shell: bash
        env:
          ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
          ASH_UPDATE_SIGNING_KEY: ${{ secrets.ASH_UPDATE_SIGNING_KEY }}
        run: |
          arch="$(node -p 'process.arch')"
          bundle="dist/Ash-darwin-${arch}/Ash.app"
          archive=".build/releases/Ash-darwin-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$archive"
          python3 -B build/darwin/notarize.py "$archive"
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          rm "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$archive"
          .build/cargo/debug/ash-update-sign \
            --repository chogng/ash \
            --product ash-desktop \
            --channel latest \
            --version "${GITHUB_REF_NAME#v}" \
            --release-tag "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}" \
            --format zip \
            --archive "$archive" \
            --output ".build/releases/ash-desktop-${{ matrix.target }}.update.json" \
            --public-key "$ASH_UPDATE_PUBLIC_KEY"
          cp "$archive" ".build/releases/ash-desktop-${{ matrix.target }}.update.json" ".build/release-artifacts/${{ matrix.target }}/"

      - name: Upload staged release packages for sanity checks
        if: github.event_name == 'release' && matrix.release_package != false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages-${{ matrix.target }}
          path: .build/release-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
