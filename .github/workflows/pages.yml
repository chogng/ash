name: Publish installation scripts

on:
  push:
    branches: [main]
    paths:
      - build/code/install.sh
      - build/code/install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Platform checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Installers may require commands introduced by their matching CLI release.
      # Never publish a main-branch installer ahead of the available binaries.
      - name: Resolve the released installer revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage installation scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ash-pages/cli"
          touch "$RUNNER_TEMP/ash-pages/.nojekyll"
          cp build/code/install.sh build/code/install.ps1 "$RUNNER_TEMP/ash-pages/cli/"
          sh -n "$RUNNER_TEMP/ash-pages/cli/install.sh"
          cmp build/code/install.sh "$RUNNER_TEMP/ash-pages/cli/install.sh"
          cmp build/code/install.ps1 "$RUNNER_TEMP/ash-pages/cli/install.ps1"

      - name: Upload static files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/ash-pages
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
