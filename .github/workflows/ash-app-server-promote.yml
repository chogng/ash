name: Promote Ash App Server stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to promote without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ash-app-server-stable-promotion
  cancel-in-progress: false

jobs:
  sanity:
    uses: ./.github/workflows/release-sanity.yml
    with:
      product: ash-app-server
      version: ${{ inputs.version }}

  promote:
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Download passing sanity reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-sanity-ash-app-server-*
          path: .build/sanity-reports
          merge-multiple: true

      - name: Build update signer
        run: python3 -B scripts/cargo.py build --package ash-update-sign --bin ash-update-sign

      - name: Sign stable App Server pointers
        env:
          ASH_UPDATE_SIGNING_KEY: ${{ secrets.ASH_UPDATE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          version="$VERSION"
          case "$version" in
            *[!0-9.]*|.*|*.) exit 2 ;;
          esac
          release_tag="v${version}"
          output=".build/stable-app-server"
          mkdir -p "$output"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu \
            aarch64-pc-windows-msvc \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              *-apple-darwin) archive="ash-app-server-${target}.zip"; format="zip" ;;
              *) archive="ash-app-server-${target}.tar.gz"; format="tar-gz" ;;
            esac
            gh release download "$release_tag" --pattern "$archive" --dir "$output"
            node build/release/sanity.ts attest \
              --product ash-app-server --version "$version" --target "$target" \
              --report ".build/sanity-reports/ash-app-server-${target}.json" \
              --archive "$output/$archive"
            .build/cargo/debug/ash-update-sign \
              --repository chogng/ash \
              --product ash-app-server \
              --channel stable \
              --version "$version" \
              --release-tag "$release_tag" \
              --target "$target" \
              --format "$format" \
              --archive "$output/$archive" \
              --output "$output/ash-app-server-stable-${target}.update.json" \
              --public-key "$ASH_UPDATE_PUBLIC_KEY"
          done

      - name: Publish stable App Server pointers
        run: |
          gh release view ash-app-server-stable >/dev/null 2>&1 || \
            gh release create ash-app-server-stable \
              --target "$GITHUB_SHA" \
              --title "Ash App Server stable channel" \
              --notes "Signed pointers managed by the stable promotion workflow." \
              --prerelease \
              --latest=false
          gh release upload ash-app-server-stable .build/stable-app-server/*.update.json --clobber
