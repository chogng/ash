name: Promote Ash Desktop stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to promote without the v prefix
        required: true
        type: string
      previous-version:
        description: Older released Desktop version to upgrade from, without v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ash-desktop-stable-promotion
  cancel-in-progress: false

jobs:
  sanity:
    uses: ./.github/workflows/release-sanity.yml
    with:
      product: ash-desktop
      version: ${{ inputs.version }}
      previous-version: ${{ inputs.previous-version }}

  promote:
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Download passing sanity reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-sanity-ash-desktop-*
          path: .build/sanity-reports
          merge-multiple: true

      - name: Build update signer
        run: python3 -B scripts/cargo.py build --package ash-update-sign --bin ash-update-sign

      - name: Sign stable Desktop pointers
        env:
          ASH_UPDATE_SIGNING_KEY: ${{ secrets.ASH_UPDATE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          version="$VERSION"
          case "$version" in
            *[!0-9.]*|.*|*.) exit 2 ;;
          esac
          release_tag="v${version}"
          output=".build/stable-desktop"
          mkdir -p "$output"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc
          do
            case "$target" in
              *-apple-darwin)
                case "$target" in
                  aarch64-*) arch="arm64" ;;
                  *) arch="x64" ;;
                esac
                archive="Ash-darwin-${arch}.zip"; format="zip" ;;
              *) archive="AshSetup-${version}-win32-x64.exe"; format="windows-exe" ;;
            esac
            gh release download "$release_tag" --pattern "$archive" --dir "$output"
            node build/release/sanity.ts attest \
              --product ash-desktop --version "$version" --target "$target" \
              --report ".build/sanity-reports/ash-desktop-${target}.json" \
              --archive "$output/$archive"
            .build/cargo/debug/ash-update-sign \
              --repository chogng/ash \
              --product ash-desktop \
              --channel stable \
              --version "$version" \
              --release-tag "$release_tag" \
              --target "$target" \
              --format "$format" \
              --archive "$output/$archive" \
              --output "$output/ash-desktop-stable-${target}.update.json" \
              --public-key "$ASH_UPDATE_PUBLIC_KEY"
          done

      - name: Publish stable Desktop pointers
        run: |
          gh release view ash-desktop-stable >/dev/null 2>&1 || \
            gh release create ash-desktop-stable \
              --target "$GITHUB_SHA" \
              --title "Ash Desktop stable channel" \
              --notes "Signed pointers managed by the stable promotion workflow." \
              --prerelease \
              --latest=false
          gh release upload ash-desktop-stable .build/stable-desktop/*.update.json --clobber
