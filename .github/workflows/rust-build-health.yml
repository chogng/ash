name: Rust checks and build performance

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "scripts/*.py"
      - "build/**"
      - "ash-rs/app-server-protocol/schema/**"
      - "scripts/pyproject.toml"
      - "scripts/requirements.txt"
      - "justfile"
      - ".github/workflows/rust-build-health.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "scripts/*.py"
      - "build/**"
      - "ash-rs/app-server-protocol/schema/**"
      - "scripts/pyproject.toml"
      - "scripts/requirements.txt"
      - "justfile"
      - ".github/workflows/rust-build-health.yml"
  workflow_dispatch:
    inputs:
      package:
        description: Cargo package to measure
        type: string
        default: ash-cli
        required: true
      profile:
        description: Cargo profile to measure
        type: choice
        options: [dev, dev-small, release]
        default: dev

permissions:
  contents: read

concurrency:
  group: rust-build-health-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trace:
    # Test binaries and their dependencies can reuse compiled results across CI runs.
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust compilation cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install trace test tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: just@1.46.0
      - name: Check trace scopes and live OTLP transport
        run: |
          # The warning gate checks every target covered by the regular check.
          just rust-warnings ash-otel -p ash-otel-trace-websocket -p ash-client -p ash-http-client --locked
          just test ash-otel -p ash-otel-trace-websocket -p ash-client -p ash-http-client --locked
          just test ash-otel --features mock --locked

  protocol:
    # Keep the performance comparison job below free of compiler cache effects.
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust compilation cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install protocol build tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: just@1.46.0
      - name: Install compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libssl-dev pkg-config
      - name: Check the default protocol build and committed artifacts
        run: |
          # The warning gate checks every target covered by the regular check.
          just rust-warnings ash-app-server-protocol --locked
          just test ash-app-server-protocol --locked
      - name: Check the protocol exporter and its runtime metadata
        run: |
          just rust-warnings ash-app-server-protocol --features export --locked
          just test ash-app-server-protocol --features export --bin generate_protocol --test schema_hash --locked

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the dependency checker
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: cargo-shear@1.13.4
      - name: Check dependency declarations, versions, ownership, and unused entries
        run: python3 -B scripts/dependencies.py

  performance:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Check out the comparison source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.before }}
          path: base
          persist-credentials: false
      - name: Use the proposed toolchain for both sources
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          channel = tomllib.loads(Path("head/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          assert "\n" not in channel and "\r" not in channel
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={channel}\n")
          PY
      - name: Prepare compiler prerequisites and both locked source graphs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libssl-dev pkg-config time
          cargo fetch --locked --manifest-path base/Cargo.toml
          cargo fetch --locked --manifest-path head/Cargo.toml
      - name: Measure the protocol compilation baseline three times
        run: |
          python3 -B head/scripts/benchmark.py ash-app-server-protocol --root base --jobs 4
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          reports = list(Path("base/.build/build-health").glob("*/report.json"))
          assert len(reports) == 1, reports
          shutil.copyfile(reports[0], "baseline.json")
          PY
      - name: Reject compilation regressions above the budget
        run: >-
          python3 -B head/scripts/benchmark.py ash-app-server-protocol --root head --jobs 4
          --compare baseline.json --max-regression 25 --absolute-regression 2
      - name: Upload both measurements even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-build-comparison
          path: |
            base/.build/build-health/
            head/.build/build-health/
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bubblewrap libcap-dev libdbus-1-dev libgtk-3-dev \
            libssl-dev libwayland-dev libxkbcommon-dev pkg-config time
      - name: Fetch locked Rust sources before measurement
        run: cargo fetch --locked
      - name: Measure three clean, unchanged, and touch builds
        env:
          BENCHMARK_PACKAGE: ${{ inputs.package }}
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: python3 -B scripts/benchmark.py "$BENCHMARK_PACKAGE" --profile "$BENCHMARK_PROFILE" --jobs 4
      - name: Upload measurements and logs, including failed builds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-build-health
          path: .build/build-health/
          if-no-files-found: warn
          retention-days: 14
