name: Bazel app boundary

on:
  push:
    branches: [main]
    paths:
      - "ash-cli/**"
      - "code/**"
      - "app-rs/**"
      - "ash-rs/**"
      - "build/**"
      - "bazel/**"
      - "third_party/tgrep/**"
      - "third_party/ripgrep/**"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel-boundary.yml"
  pull_request:
    paths:
      - "ash-cli/**"
      - "code/**"
      - "app-rs/**"
      - "ash-rs/**"
      - "build/**"
      - "bazel/**"
      - "third_party/tgrep/**"
      - "third_party/ripgrep/**"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/bazel-boundary.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: bazel-boundary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-app-boundary
          repository-cache: true
          cache-save: true
      - name: Test app boundary contract
        run: bazel test --config=ci //app-rs:app_ci --test_output=errors --test_env=PATH

  tui-scenarios:
    name: Bazel TUI scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Prepare locked search programs
        run: |
          python3 -B - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from build.lib.targets import TARGETS
          from build.ash_rs.ripgrep import resolve_ripgrep
          from build.ash_rs.tgrep import resolve_tgrep

          root = Path.cwd()
          target = TARGETS["x86_64-unknown-linux-gnu"]
          programs = {
              "ASH_RG_PATH": resolve_ripgrep(
                  target,
                  root / "third_party/ripgrep/runtime-lock.json",
                  root / "third_party/.cache/ripgrep",
              ).executable,
              "ASH_TGREP_PATH": resolve_tgrep(
                  target,
                  root / "third_party/tgrep/runtime-lock.json",
                  root / "third_party/.cache/tgrep",
              ).executable,
          }
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, executable in programs.items():
                  subprocess.run([executable, "--version"], check=True)
                  output.write(f"{name}={executable}\n")
          PY

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bazel-tui-scenarios
          repository-cache: true

      - name: Test real TUI terminal scenarios
        run: >-
          bazel test --config=ci //ash-cli:tui-real-scenarios --test_output=errors
          --test_env=PATH --test_env=ASH_RG_PATH --test_env=ASH_TGREP_PATH
          --test_arg=--test-threads=4 --test_arg=--skip --test_arg=actual_tui_sandbox_

      - name: Upload TUI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-tui-scenarios-${{ github.run_attempt }}
          path: |
            .build/bazel-testlogs/ash-cli/tui-real-scenarios/test.log
            .build/bazel-testlogs/ash-cli/tui-real-scenarios/test.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
