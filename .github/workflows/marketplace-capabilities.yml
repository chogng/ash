name: Marketplace capabilities

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: marketplace-capabilities-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test Marketplace capability crates
        run: cargo test --locked -p ash-plugins -p ash-marketplace-client -p ash-marketplace-manager -p ash-extension-catalog -p ash-external-ext-sdk -p ash-app-server-protocol
      - name: Lint Marketplace capability crates
        run: cargo clippy --locked -p ash-plugins -p ash-marketplace-client -p ash-marketplace-manager -p ash-extension-catalog -p ash-external-ext-sdk -p ash-app-server-protocol --all-targets --no-deps -- -D warnings
