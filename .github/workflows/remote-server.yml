name: Remote Server release

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
    secrets:
      ASH_MACOS_CERTIFICATE_P12:
        required: false
      ASH_MACOS_CERTIFICATE_PASSWORD:
        required: false
      ASH_MACOS_NOTARY_KEY_P8:
        required: false
      ASH_MACOS_NOTARY_KEY_ID:
        required: false
      ASH_MACOS_NOTARY_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      platforms:
        description: Remote release platforms
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      targets: ${{ steps.platforms.outputs.targets }}
    steps:
      - id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
          MACOS_SIGNING_READY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY != '' && secrets.ASH_MACOS_CERTIFICATE_P12 != '' && secrets.ASH_MACOS_CERTIFICATE_PASSWORD != '' && secrets.ASH_MACOS_NOTARY_KEY_P8 != '' && secrets.ASH_MACOS_NOTARY_KEY_ID != '' && secrets.ASH_MACOS_NOTARY_ISSUER != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          scope = os.environ['PLATFORMS']
          assert scope in ('all', 'linux'), 'Remote platforms must be all or linux'
          if scope == 'all' and os.environ['MACOS_SIGNING_READY'] != 'true':
              raise SystemExit('Configure the macOS signing variable and five Apple secrets documented in remote-server/README.md, or select platforms=linux')
          platforms = [
              {'runner': 'macos-26', 'target': 'aarch64-apple-darwin'},
              {'runner': 'macos-26-intel', 'target': 'x86_64-apple-darwin'},
              {'runner': 'ubuntu-24.04', 'target': 'x86_64-unknown-linux-gnu'},
              {'runner': 'ubuntu-24.04-arm', 'target': 'aarch64-unknown-linux-gnu'},
          ]
          selected = [p for p in platforms if scope == 'all' or 'linux' in p['target']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': selected}), file=output)
              print('targets=' + json.dumps([p['target'] for p in selected]), file=output)
          PY

  build:
    needs: plan
    name: Remote ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ASH_BUILD_COMMIT: ${{ github.sha }}
      ASH_BUILD_ID: remote-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      ASH_SYMBOLS_DIR: ${{ github.workspace }}/.build/remote-release/symbols
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ". -> .build/cargo"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: runner.os == 'macOS'
        with:
          go-version: "1.26"
          cache: false
      - name: Install Linux build and symbol tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config llvm lldb libssl-dev libcap-dev libdbus-1-dev libgtk-3-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - name: Prepare packaging dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Build standalone Remote package
        run: python3 -B build/remote.py --target "${{ matrix.target }}" --package-dir .build/remote-release/runtime --capability-archive-dir .build/remote-release/attachments
      - name: Verify connection, editing, terminal and Agent without media installation
        run: python3 -B build/remote_smoke.py --package-dir .build/remote-release/runtime --report .build/remote-release/smoke.json
      - name: Import macOS release certificate
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_CERTIFICATE_P12: ${{ secrets.ASH_MACOS_CERTIFICATE_P12 }}
          ASH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ASH_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$ASH_MACOS_CERTIFICATE_P12"
          test -n "$ASH_MACOS_CERTIFICATE_PASSWORD"
          signing_dir="$RUNNER_TEMP/ash-remote-signing"
          mkdir -p "$signing_dir"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ash-remote-signing", "certificate.p12").write_bytes(base64.b64decode(os.environ["ASH_MACOS_CERTIFICATE_P12"], validate=True))'
          keychain="$signing_dir/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$ASH_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          login_keychain="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "$login_keychain"
      - name: Sign macOS Remote executables
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_SIGNING_IDENTITY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY }}
        run: python3 -B build/sign.py --package-dir .build/remote-release/runtime --target "${{ matrix.target }}"
      - name: Notarize macOS Remote executables before archiving
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_NOTARY_KEY_P8: ${{ secrets.ASH_MACOS_NOTARY_KEY_P8 }}
          ASH_MACOS_NOTARY_KEY_ID: ${{ secrets.ASH_MACOS_NOTARY_KEY_ID }}
          ASH_MACOS_NOTARY_ISSUER: ${{ secrets.ASH_MACOS_NOTARY_ISSUER }}
        run: |
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ash-remote-signing", "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ASH_MACOS_NOTARY_KEY_P8"], validate=True))'
          xcrun notarytool store-credentials ash-remote-release --key "$RUNNER_TEMP/ash-remote-signing/AuthKey.p8" --key-id "$ASH_MACOS_NOTARY_KEY_ID" --issuer "$ASH_MACOS_NOTARY_ISSUER"
          export ASH_MACOS_NOTARY_PROFILE=ash-remote-release
          ditto -c -k .build/remote-release/runtime .build/remote-release/notarize.zip
          python3 -B build/darwin/notarize.py .build/remote-release/notarize.zip
          rm .build/remote-release/notarize.zip
      - name: Create immutable rootless Remote archive and companion symbols
        run: |
          mkdir -p .build/remote-release/assets
          python3 -B build/release/remote.py archive --package-dir .build/remote-release/runtime --output ".build/remote-release/assets/ash-remote-${{ matrix.target }}.tar.gz"
          python3 -B build/release/symbols.py archive --package ash-remote=.build/remote-release/runtime --archive "ash-remote=.build/remote-release/assets/ash-remote-${{ matrix.target }}.tar.gz" --output ".build/remote-release/assets/ash-symbols-remote-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-package-${{ matrix.target }}
          path: .build/remote-release/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-server-smoke-${{ matrix.target }}
          path: .build/remote-release/smoke.json

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REMOTE_TAG: remote-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: remote-package-*
          path: .build/remote-release/assets
          merge-multiple: true
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Prepare actual Desktop bootstrap and SSH verification
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - name: Assemble complete catalog and matching client binding
        run: |
          python3 -B build/release/remote.py catalog \
            --archives-dir .build/remote-release/assets \
            --output .build/remote-release/assets/catalog.json \
            --binding-file .build/remote-release/remote-release.json \
            --repository "$GITHUB_REPOSITORY" --release-tag "$REMOTE_TAG" \
            $(python3 -c 'import json, os; print(" ".join("--target " + target for target in json.loads(os.environ["REMOTE_TARGETS"])))')
      - name: Publish independent Remote release without replacing existing assets
        run: |
          gh release create "$REMOTE_TAG" .build/remote-release/assets/* .build/remote-release/remote-release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Remote Server $REMOTE_TAG" --notes "Immutable editing and Agent runtimes; clients pin the catalog digest and protocol." \
            --prerelease --latest=false
      - name: Verify published catalog bytes
        run: |
          gh release download "$REMOTE_TAG" --repo "$GITHUB_REPOSITORY" --pattern catalog.json --dir .build/remote-release/downloaded
          cmp .build/remote-release/assets/catalog.json .build/remote-release/downloaded/catalog.json
      - name: Verify the published release through the actual Remote downloader
        run: |
          client="$GITHUB_WORKSPACE/.build/remote-release/client"
          cache="$GITHUB_WORKSPACE/.build/remote-release/cache"
          mkdir -p "$client"
          tar -xzf .build/remote-release/assets/ash-remote-x86_64-unknown-linux-gnu.tar.gz -C "$client"
          catalog_url="$(python3 -c 'import json; print(json.load(open(".build/remote-release/remote-release.json"))["catalog"]["url"])')"
          catalog_sha="$(python3 -c 'import json; print(json.load(open(".build/remote-release/remote-release.json"))["catalog"]["sha256"])')"
          for attempt in first cached; do
            "$client/bin/ash-remote" fetch-runtime --catalog-url "$catalog_url" --catalog-sha256 "$catalog_sha" \
              --target x86_64-unknown-linux-gnu --cache-root "$cache" --progress json-lines \
              > ".build/remote-release/$attempt.json" 2> ".build/remote-release/$attempt.progress.jsonl"
          done
          cmp .build/remote-release/first.json .build/remote-release/cached.json
          python3 -c 'import json; events=[json.loads(line) for line in open(".build/remote-release/cached.progress.jsonl")]; assert any(event.get("phase")=="complete" and event.get("disposition")=="reused" for event in events)'
      - name: Verify automatic first connection, reconnect, editing and Agent from published assets
        run: |
          python3 -B build/release/verify_remote.py --package-dir .build/remote-release/client \
            --binding-file .build/remote-release/remote-release.json \
            --report .build/remote-release/verification/published-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-published-release-verification
          path: .build/remote-release/verification
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-server-release-binding
          path: .build/remote-release/remote-release.json
          if-no-files-found: error
