name: Remote Server release

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
      verify_runtime_run:
        type: string
        default: ""
    secrets:
      ASH_MACOS_CERTIFICATE_P12:
        required: false
      ASH_MACOS_CERTIFICATE_PASSWORD:
        required: false
      ASH_MACOS_NOTARY_KEY_P8:
        required: false
      ASH_MACOS_NOTARY_KEY_ID:
        required: false
      ASH_MACOS_NOTARY_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      platforms:
        description: Remote release platforms
        type: choice
        options: [all, linux, windows]
        default: all
      verify_runtime_run:
        description: Recheck failed Windows runtime artifacts from this workflow run without publishing
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      targets: ${{ steps.platforms.outputs.targets }}
    steps:
      - id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
          VERIFY_RUNTIME_RUN: ${{ inputs.verify_runtime_run }}
          MACOS_SIGNING_READY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY != '' && secrets.ASH_MACOS_CERTIFICATE_P12 != '' && secrets.ASH_MACOS_CERTIFICATE_PASSWORD != '' && secrets.ASH_MACOS_NOTARY_KEY_P8 != '' && secrets.ASH_MACOS_NOTARY_KEY_ID != '' && secrets.ASH_MACOS_NOTARY_ISSUER != '' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          scope = os.environ['PLATFORMS']
          assert scope in ('all', 'linux', 'windows'), 'Remote platforms must be all, linux or windows'
          replay = os.environ.get('VERIFY_RUNTIME_RUN', '')
          if replay and (scope != 'windows' or not re.fullmatch(r'[1-9][0-9]*', replay)):
              raise SystemExit('Runtime recheck requires platforms=windows and a numeric workflow run ID')
          if scope == 'all' and os.environ['MACOS_SIGNING_READY'] != 'true':
              raise SystemExit('Configure the macOS signing variable and five Apple secrets documented in remote-server/README.md, or select platforms=linux/windows')
          platforms = [
              {'runner': 'macos-26', 'target': 'aarch64-apple-darwin'},
              {'runner': 'macos-26-intel', 'target': 'x86_64-apple-darwin'},
              {'runner': 'ubuntu-24.04', 'target': 'x86_64-unknown-linux-gnu'},
              {'runner': 'ubuntu-24.04-arm', 'target': 'aarch64-unknown-linux-gnu'},
              {'runner': 'windows-2025', 'target': 'x86_64-pc-windows-msvc'},
              {'runner': 'windows-11-arm', 'target': 'aarch64-pc-windows-msvc'},
          ]
          selected = [p for p in platforms if scope == 'all' or scope in p['target']]
          for platform in selected:
              platform['python'] = 'python' if 'windows' in platform['target'] else 'python3'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': selected}), file=output)
              print('targets=' + json.dumps([p['target'] for p in selected]), file=output)
          PY

  build:
    if: ${{ inputs.verify_runtime_run == '' }}
    needs: plan
    name: Remote ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Allow the measured Windows x64 release build plus native installer and smoke checks.
    timeout-minutes: ${{ contains(matrix.target, 'windows') && 90 || 60 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ASH_BUILD_COMMIT: ${{ github.sha }}
      ASH_BUILD_ID: remote-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      ASH_SYMBOLS_DIR: ${{ github.workspace }}/.build/remote-release/symbols
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ". -> .build/cargo"
          cache-on-failure: true
      - name: Install Linux build and symbol tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config llvm lldb libcap-dev libwayland-dev
      - name: Install Windows symbol tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare packaging dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Test Windows fixture cleanup with a running executable
        if: runner.os == 'Windows'
        run: ${{ matrix.python }} -B -m unittest build.test_remote_smoke
      - name: Build locked Windows search tool before the full backend
        if: runner.os == 'Windows'
        run: |
          ${{ matrix.python }} - "${{ matrix.target }}" <<'PY'
          from pathlib import Path
          import sys
          from build.lib.targets import TARGETS
          from build.lib.tgrep import resolve_tgrep
          resolve_tgrep(TARGETS[sys.argv[1]], Path('third_party/tgrep/runtime-lock.json'), Path('third_party/.cache/tgrep'))
          PY
      - name: Test Windows binary upload, immutable package and receipt migration
        if: runner.os == 'Windows'
        run: ${{ matrix.python }} -B scripts/cargo.py test -p ash-remote-connections --profile ci-test --locked --target "${{ matrix.target }}" --lib install_tests::powershell_installer_preserves_binary_uploads_and_reuses_immutable_runtime -- --exact
      - name: Install Windows OpenSSH fixture prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if ($capability.State -ne 'Installed') {
            $installation = Add-WindowsCapability -Online -Name $capability.Name
            if ($installation.RestartNeeded) { throw 'OpenSSH installation requires a restart' }
          }
      - name: Verify large binary install and reuse over real Windows SSH
        if: runner.os == 'Windows'
        run: ${{ matrix.python }} -B build/release/verify_windows_installer.py --target "${{ matrix.target }}" --reports .build/remote-release/installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'Windows'
        with:
          name: remote-windows-installer-${{ matrix.target }}
          path: .build/remote-release/installer
          if-no-files-found: ignore
      - name: Build standalone Remote package
        run: ${{ matrix.python }} -B build/remote.py --target "${{ matrix.target }}" --package-dir .build/remote-release/runtime
      - name: Verify connection, editing, terminal and Agent without media installation
        run: ${{ matrix.python }} -B build/remote_smoke.py --package-dir .build/remote-release/runtime --report .build/remote-release/smoke.json
      - name: Import macOS release certificate
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_CERTIFICATE_P12: ${{ secrets.ASH_MACOS_CERTIFICATE_P12 }}
          ASH_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ASH_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$ASH_MACOS_CERTIFICATE_P12"
          test -n "$ASH_MACOS_CERTIFICATE_PASSWORD"
          signing_dir="$RUNNER_TEMP/ash-remote-signing"
          mkdir -p "$signing_dir"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ash-remote-signing", "certificate.p12").write_bytes(base64.b64decode(os.environ["ASH_MACOS_CERTIFICATE_P12"], validate=True))'
          keychain="$signing_dir/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$ASH_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          login_keychain="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "$login_keychain"
      - name: Sign macOS Remote executables
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_SIGNING_IDENTITY: ${{ vars.ASH_MACOS_SIGNING_IDENTITY }}
        run: python3 -B build/sign.py --package-dir .build/remote-release/runtime --target "${{ matrix.target }}"
      - name: Notarize macOS Remote executables before archiving
        if: runner.os == 'macOS'
        env:
          ASH_MACOS_NOTARY_KEY_P8: ${{ secrets.ASH_MACOS_NOTARY_KEY_P8 }}
          ASH_MACOS_NOTARY_KEY_ID: ${{ secrets.ASH_MACOS_NOTARY_KEY_ID }}
          ASH_MACOS_NOTARY_ISSUER: ${{ secrets.ASH_MACOS_NOTARY_ISSUER }}
        run: |
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ash-remote-signing", "AuthKey.p8").write_bytes(base64.b64decode(os.environ["ASH_MACOS_NOTARY_KEY_P8"], validate=True))'
          xcrun notarytool store-credentials ash-remote-release --key "$RUNNER_TEMP/ash-remote-signing/AuthKey.p8" --key-id "$ASH_MACOS_NOTARY_KEY_ID" --issuer "$ASH_MACOS_NOTARY_ISSUER"
          export ASH_MACOS_NOTARY_PROFILE=ash-remote-release
          ditto -c -k .build/remote-release/runtime .build/remote-release/notarize.zip
          python3 -B build/darwin/notarize.py .build/remote-release/notarize.zip
          rm .build/remote-release/notarize.zip
      - name: Create immutable rootless Remote archive and companion symbols
        run: |
          mkdir -p .build/remote-release/assets
          ${{ matrix.python }} -B build/release/remote.py archive --package-dir .build/remote-release/runtime --output ".build/remote-release/assets/ash-remote-${{ matrix.target }}.tar.gz"
          ${{ matrix.python }} -B build/release/symbols.py archive --package ash-remote=.build/remote-release/runtime --archive "ash-remote=.build/remote-release/assets/ash-remote-${{ matrix.target }}.tar.gz" --output .build/remote-release/symbols
          symbol_archive="$(find .build/remote-release/symbols -maxdepth 1 -type f -name 'ash-symbols-*.tar.gz' -print -quit)"
          test -n "$symbol_archive"
          mv "$symbol_archive" .build/remote-release/assets/
          mv "$symbol_archive.sha256" .build/remote-release/assets/
          if find .build/remote-release/assets -mindepth 1 -type d -print -quit | grep -q .; then
            echo "Remote release assets must contain files, not directories" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-package-${{ matrix.target }}
          path: .build/remote-release/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-server-smoke-${{ matrix.target }}
          path: |
            .build/remote-release/smoke.json
            .build/remote-release/*-wire.json
            .build/remote-release/*-stop.json
            .build/remote-release/*.log
      - name: Preserve constructed runtime for failure reproduction
        if: failure() && hashFiles('.build/remote-release/runtime/ash-package.json') != ''
        run: |
          ${{ matrix.python }} -B build/release/remote.py archive --unsigned \
            --package-dir .build/remote-release/runtime \
            --output ".build/remote-release/failed/ash-remote-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: remote-failed-runtime-${{ matrix.target }}
          path: .build/remote-release/failed/*
          compression-level: 0
          if-no-files-found: ignore

  publish:
    if: ${{ inputs.verify_runtime_run == '' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REMOTE_TAG: remote-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: remote-package-*
          path: .build/remote-release/assets
          merge-multiple: true
      - name: Assemble complete catalog and matching client binding
        run: |
          mapfile -t target_args < <(python3 -c 'import json, os; print("\n".join(arg for target in json.loads(os.environ["REMOTE_TARGETS"]) for arg in ("--target", target)))')
          python3 -B build/release/remote.py catalog \
            --archives-dir .build/remote-release/assets \
            --output .build/remote-release/assets/catalog.json \
            --binding-file .build/remote-release/remote-release.json \
            --repository "$GITHUB_REPOSITORY" --release-tag "$REMOTE_TAG" \
            "${target_args[@]}"
      - name: Publish independent Remote release without replacing existing assets
        run: |
          gh release create "$REMOTE_TAG" .build/remote-release/assets/* .build/remote-release/remote-release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Remote Server $REMOTE_TAG" --notes "Immutable editing and Agent runtimes; clients pin the catalog digest and protocol." \
            --prerelease --latest=false
      - name: Verify published catalog bytes
        run: |
          gh release download "$REMOTE_TAG" --repo "$GITHUB_REPOSITORY" --pattern catalog.json --dir .build/remote-release/downloaded
          cmp .build/remote-release/assets/catalog.json .build/remote-release/downloaded/catalog.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-server-candidate-binding
          path: .build/remote-release/remote-release.json
          if-no-files-found: error

  recheck:
    if: ${{ inputs.verify_runtime_run != '' }}
    needs: plan
    name: Recheck Windows runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the same-repository runtime producer
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUNTIME_RUN: ${{ inputs.verify_runtime_run }}
        run: |
          mkdir -p .build/remote-recheck/reports
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUNTIME_RUN" > .build/remote-recheck/reports/source-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('.build/remote-recheck/reports/source-run.json').read_text())
          assert run['id'] == int(os.environ['VERIFY_RUNTIME_RUN'])
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/remote-server.yml'
          assert run['event'] == 'workflow_dispatch' and run['status'] == 'completed'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remote-failed-runtime-${{ matrix.target }}
          path: .build/remote-recheck/assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.verify_runtime_run }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Prepare current acceptance runner
        run: pnpm install --frozen-lockfile
      - name: Install Windows OpenSSH fixture prerequisites
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if ($capability.State -ne 'Installed') {
            $installation = Add-WindowsCapability -Online -Name $capability.Name
            if ($installation.RestartNeeded) { throw 'OpenSSH installation requires a restart' }
          }
      - name: Verify archive contents before execution
        run: |
          python -B build/release/remote.py catalog --archives-dir .build/remote-recheck/assets \
            --output .build/remote-recheck/assets/catalog.json --binding-file .build/remote-recheck/local-binding.json \
            --repository "$GITHUB_REPOSITORY" --release-tag "recheck-${{ inputs.verify_runtime_run }}" --target "${{ matrix.target }}"
          mkdir -p .build/remote-recheck/runtime
          tar -xzf ".build/remote-recheck/assets/ash-remote-${{ matrix.target }}.tar.gz" -C .build/remote-recheck/runtime
      - name: Run current native acceptance against the retained package
        run: python -B build/remote_smoke.py --package-dir .build/remote-recheck/runtime --report .build/remote-recheck/reports/native/smoke.json
      - name: Run current Desktop bootstrap and SSH acceptance against the retained package
        run: |
          python -B build/release/verify_remote.py --package-dir .build/remote-recheck/runtime \
            --catalog-dir .build/remote-recheck/assets --report .build/remote-recheck/reports/ssh/acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-runtime-recheck-${{ matrix.target }}
          path: .build/remote-recheck/reports
          if-no-files-found: error

  verify:
    needs: [plan, publish]
    name: Published Remote SSH ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REMOTE_TAG: remote-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remote-server-candidate-binding
          path: .build/remote-release
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Prepare Desktop bootstrap verification
        run: pnpm install --frozen-lockfile
      - name: Install Linux OpenSSH fixture prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - name: Install Windows OpenSSH fixture prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if ($capability.State -ne 'Installed') {
            $installation = Add-WindowsCapability -Online -Name $capability.Name
            if ($installation.RestartNeeded) { throw 'OpenSSH installation requires a restart' }
          }
      - name: Download the published client runtime
        run: |
          gh release download "$REMOTE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "ash-remote-${{ matrix.target }}.tar.gz" --dir .build/remote-release
          mkdir -p .build/remote-release/client
          tar -xzf ".build/remote-release/ash-remote-${{ matrix.target }}.tar.gz" -C .build/remote-release/client
      - name: Verify automatic download, installation, version match, reconnect and Agent over SSH
        run: |
          ${{ matrix.python }} -B build/release/verify_remote.py --package-dir .build/remote-release/client \
            --binding-file .build/remote-release/remote-release.json \
            --report .build/remote-release/verification/published-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-published-release-verification-${{ matrix.target }}
          path: .build/remote-release/verification
          if-no-files-found: error

  binding:
    # Desktop/Code packages may consume this binding only after every target passed SSH acceptance.
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remote-server-candidate-binding
          path: .build/remote-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-server-release-binding
          path: .build/remote-release/remote-release.json
          if-no-files-found: error
