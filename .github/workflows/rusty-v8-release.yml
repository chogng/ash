name: rusty-v8-release

on:
  push:
    tags: ["rusty-v8-v*.*.*"]
  # Manual runs validate the source build without creating a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusty-v8-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

defaults:
  run:
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_revision: ${{ steps.metadata.outputs.source_revision }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Resolve and validate the exact V8 pin
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(metadata --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = push ]; then args+=(--tag "$REF_NAME"); fi
          python3 -B build/v8/release.py "${args[@]}"

  build:
    name: Sandbox / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enable upstream Windows symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - name: Check out matching rusty_v8 source
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: denoland/rusty_v8
          ref: ${{ needs.metadata.outputs.source_revision }}
          path: upstream-rusty-v8
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: just@1.46.0
      - name: Set up compiler cache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Apply pinned V8 source backport
        if: runner.os == 'Windows'
        run: |
          patch="$GITHUB_WORKSPACE/third_party/v8/patches/v8_array_sort_elements_kind.patch"
          git -C upstream-rusty-v8/v8 apply --check -p3 "$patch"
          git -C upstream-rusty-v8/v8 apply -p3 "$patch"
      - name: Resolve upstream build toolchain
        if: runner.os == 'Windows'
        id: upstream
        run: |
          python -B build/v8/release.py windows-tools --upstream upstream-rusty-v8
          python -B build/v8/release.py upstream-toolchain --upstream upstream-rusty-v8 --github-output "$GITHUB_OUTPUT"
      - name: Install upstream toolchain and target
        if: runner.os == 'Windows'
        env:
          UPSTREAM_TOOLCHAIN: ${{ steps.upstream.outputs.toolchain }}
        run: |
          rustup toolchain install "$UPSTREAM_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$UPSTREAM_TOOLCHAIN" "$TARGET"
      - name: Install Linux Cargo smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
      - name: Build Windows sandbox archive and binding from source
        if: runner.os == 'Windows'
        working-directory: upstream-rusty-v8
        env:
          UPSTREAM_TOOLCHAIN: ${{ steps.upstream.outputs.toolchain }}
          V8_FROM_SOURCE: "1"
          # Keep upstream outputs separate from Ash's Cargo target directory.
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-rusty-v8/target
        run: |
          # Let rusty_v8 fetch its source-pinned compiler and matching libclang.
          unset CLANG_BASE_PATH LIBCLANG_PATH BINDGEN_EXTRA_CLANG_ARGS DISABLE_CLANG
          export GN_ARGS="v8_enable_partition_alloc=false"
          cargo "+$UPSTREAM_TOOLCHAIN" build --locked --release --target "$TARGET" --features v8_enable_sandbox
      - name: Set up Bazel source producer and consumer
        if: runner.os != 'Windows'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          disk-cache: v8-source-${{ matrix.target }}
          repository-cache: true
      - name: Build and stage archive, binding and checksums
        id: stage
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -B build/v8/release.py stage --upstream upstream-rusty-v8 --target "$TARGET" --output "dist/$TARGET" --github-output "$GITHUB_OUTPUT"
          else
            python -B build/v8/release.py bazel-stage --target "$TARGET" --output "dist/$TARGET" --github-output "$GITHUB_OUTPUT"
          fi
      # Preserve the exact source inputs even when a consumer fails. Release
      # aggregation still requires this job's later consumer checks to pass.
      - name: Upload staged target inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rusty-v8-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          # A retried job replaces only its validation inputs in this run.
          overwrite: true
      - name: Install Ash smoke-test target
        run: rustup target add "$TARGET"
      - name: Prepare checksum-pinned musl linker
        if: endsWith(matrix.target, '-linux-musl')
        run: python -B build/v8/smoke.py musl-linker --target "$TARGET" --output "$RUNNER_TEMP/v8-musl-linker" --github-env "$GITHUB_ENV"
      - name: Test staged pair with Ash
        env:
          SMOKE: ${{ matrix.smoke }}
          RUSTY_V8_ARCHIVE: ${{ steps.stage.outputs.archive }}
          RUSTY_V8_SRC_BINDING_PATH: ${{ steps.stage.outputs.binding }}
        run: |
          args=(ash-v8-poc --locked --target "$TARGET" --features sandbox)
          if [ "$SMOKE" = link ]; then
            args+=(--no-run)
          else
            # Concurrent first isolates can race V8's process-wide sandbox pool setup.
            args+=(-- --test-threads=1)
          fi
          just test "${args[@]}"
      - name: Verify staged pair through the Bazel consumer
        if: runner.os != 'Windows'
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          args=(bazel --target "$TARGET" --artifacts "dist/$TARGET" --output "$RUNNER_TEMP/v8-bazel-inputs")
          if [ "$SMOKE" = link ]; then args+=(--link-only); fi
          python -B build/v8/smoke.py "${args[@]}"

  test-arm-gnu:
    name: Execute sandbox / aarch64-unknown-linux-gnu
    # Chromium ships x64 Linux build tools. Execute the cross-built pair on ARM64.
    needs: [metadata, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: just@1.46.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rusty-v8-${{ needs.metadata.outputs.version }}-aarch64-unknown-linux-gnu
          path: dist/aarch64-unknown-linux-gnu
      - name: Validate downloaded pair and select Cargo inputs
        run: python -B build/v8/smoke.py pair --target "$TARGET" --artifacts "dist/$TARGET" --github-env "$GITHUB_ENV"
      - name: Execute staged pair with Ash on ARM64
        run: just test ash-v8-poc --locked --target "$TARGET" --features sandbox -- --test-threads=1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          disk-cache: v8-consumer-aarch64-gnu-execution
          repository-cache: true
      - name: Execute staged pair through Bazel on ARM64
        run: python -B build/v8/smoke.py bazel --target "$TARGET" --artifacts "dist/$TARGET" --output "$RUNNER_TEMP/v8-bazel-inputs"

  verify:
    needs: [metadata, build, test-arm-gnu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rusty-v8-${{ needs.metadata.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and generate candidate lock
        run: python3 -B build/v8/release.py verify --artifacts dist --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rusty-v8-release-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [metadata, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rusty-v8-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rusty-v8-release-${{ needs.metadata.outputs.version }}
          path: dist
      - name: Publish immutable V8 dependency release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          # Existing releases are never replaced; a failed draft can be reviewed manually.
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$RELEASE_TAG" \
            --notes "Sandbox-enabled rusty_v8 archive/binding pairs for the pinned crate version. runtime-lock.json is a candidate consumer lock; adopt it together with the Bazel input checksums."
