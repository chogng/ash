name: Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  # Finish main acceptance; newer runs replace only the pending main run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-setup:
    name: Windows setup lifecycle
    uses: ./.github/workflows/bun-benchmark.yml
    with:
      runner: windows-latest
      phase: setup

  contracts:
    name: Frontend contracts and units
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          install: false
      - name: Install frontend build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxkbfile-dev libcap-dev libssl-dev pkg-config
      - name: Cache protocol exporter builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ". -> .build/cargo"
          shared-key: frontend-contracts
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version-file: scripts/pyproject.toml
      - name: Sync locked Python tools
        run: python -B scripts/install_python_tools.py
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check localization, styles and generated contracts
        run: |
          pnpm run prepare:generated
          pnpm exec bun build/resources/localization.ts --check
          pnpm stylelint
          ./node_modules/bun/bin/bun.exe check -p tsconfig.protocol.json --all
          ./node_modules/bun/bin/bun.exe check -p tsconfig.renderer.json --all
      - name: Check and test build tools
        run: |
          ./node_modules/bun/bin/bun.exe check -p build/tsconfig.json --all
          pnpm --dir test/scenario compile
          pnpm --dir build run test:prepared
          pnpm run build:stanza:prepared
      # Reuse this job's frontend, Python and Rust tools instead of installing
      # them again in the source-format gate. Unit-only tooling jobs lack Bun.
      - name: Test scoped formatting with real tools
        working-directory: scripts
        run: .venv/bin/python -B -m unittest test_format.ScopedFormattingTests
      - name: Install Chromium for browser service unit tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test frontend units
        run: |
          pnpm run prepare:output
          pnpm run test:unit:prepared
          pnpm run test:unit:runner

  desktop-runtime:
    needs: contracts
    uses: ./.github/workflows/desktop-runtime-acceptance.yml

  check:
    name: ${{ matrix.surface }} (${{ matrix.runner }})
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: browser
            runner: ubuntu-24.04
          - surface: electron
            runner: windows-latest
          - surface: electron
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_LIST_PRINT_FAILURES_INLINE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - name: Install Linux frontend and App Server build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxkbfile-dev libcap-dev libssl-dev pkg-config
      - name: Set up the App Server media build toolchain
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: false
      - name: Cache App Server builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          cache-directories: third_party/.cache/v8
      - name: Restore complete V8 build inputs
        run: |
          # rust-cache prunes gn_out but retains V8's build-script fingerprint.
          # Re-run only that crate so linking recreates the verified static library.
          cargo clean --package v8 --profile dev-small
          cargo fetch --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version-file: scripts/pyproject.toml
      # Protocol prehooks resolve the repository interpreter on Windows.
      - name: Sync locked Python tools
        run: python -B scripts/install_python_tools.py
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore desktop addon artifacts
        id: desktop-addons
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .build/desktop-addons
          key: desktop-addons-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'build/desktop/addons.ts') }}
      - name: Install Chromium
        if: matrix.surface == 'browser'
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Check sources and build Desktop and Web on every platform
        # Each runner checks its own platform declarations once. The Desktop
        # and both Web bundles reuse these inputs without lifecycle rechecks.
        run: |
          node build/prepare.ts
          ./node_modules/bun/bin/bun.exe check -p tsconfig.renderer.json --all
          ./node_modules/bun/bin/bun.exe check -p test/automation/tsconfig.json --all
          pnpm run prepare:electron
          pnpm run prepare:desktop-addons
          pnpm run build:prepared
          pnpm run bundle:web
      - name: Save verified desktop addon artifacts
        if: github.ref == 'refs/heads/main' && steps.desktop-addons.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .build/desktop-addons
          key: ${{ steps.desktop-addons.outputs.cache-primary-key }}
      - name: Test browser integration
        if: matrix.surface == 'browser'
        run: pnpm run test:browser:integration:prepared --project=chromium --project=chrome-gpu
      - name: Test Windows process ownership
        if: runner.os == 'Windows'
        run: pnpm exec node --test build/processes.test.ts
      - name: Test production browser UI
        if: matrix.surface == 'browser'
        run: pnpm run test:smoke:browser:no-compile
      - name: Prepare Electron UI smoke tests
        if: matrix.surface == 'electron'
        # Startup reads runtime metadata for Tunnel services even in UI-only mode.
        # Connected smoke tests reuse this runtime and the same Desktop build.
        run: pnpm run prepare:backend
      - name: Test Electron UI
        if: matrix.surface == 'electron'
        run: pnpm run test:smoke:ui:no-compile
      - name: Prepare connected Web smoke tests
        if: matrix.surface == 'browser'
        run: |
          pnpm run bundle:web:full
          pnpm run prepare:backend:web
      - name: Test connected Web
        if: matrix.surface == 'browser'
        run: pnpm run test:smoke:browser:full:no-compile
      - name: Build connected Web on Desktop runners
        if: matrix.surface == 'electron'
        run: pnpm run bundle:web:full
      - name: Test connected Electron
        if: matrix.surface == 'electron'
        run: pnpm run test:smoke:desktop:no-compile --grep-invert "Mock Agent Task loop"
      - name: Test mock Agent process and shell Task execution
        if: matrix.surface == 'electron'
        # Real Agent/Core, approval, TaskService, exec-server and Desktop UI;
        # only the loopback model Responses are mocked, with no account secrets.
        run: pnpm run test:smoke:desktop:no-compile test/smoke/areas/tasks/task-agent.spec.ts
      - name: Upload test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.surface }}-${{ matrix.runner }}
          path: .build/desktop/playwright/
          if-no-files-found: warn
