name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "extension-sdk/**"
      - "localization/**"
      - "licenses/**"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "build/**"
      - "scripts/pyproject.toml"
      - "scripts/uv.lock"
      - "scripts/install_python_tools.py"
      - "third_party/livekit/**"
      - "resources/**"
      - "extensions/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "extension-sdk/**"
      - "localization/**"
      - "licenses/**"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "build/**"
      - "scripts/pyproject.toml"
      - "scripts/uv.lock"
      - "scripts/install_python_tools.py"
      - "third_party/livekit/**"
      - "resources/**"
      - "extensions/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  # Finish main acceptance; newer runs replace only the pending main run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: ${{ matrix.surface }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: browser
            runner: ubuntu-24.04
          - surface: electron
            runner: windows-latest
          - surface: electron
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_LIST_PRINT_FAILURES_INLINE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
      - name: Install Linux frontend and App Server build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxkbfile-dev libcap-dev libssl-dev pkg-config
      - name: Set up the App Server media build toolchain
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: false
      - name: Cache App Server builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version-file: scripts/pyproject.toml
      # Protocol prehooks resolve the repository interpreter on Windows.
      - name: Sync locked Python tools
        run: python -B scripts/install_python_tools.py
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check localization sources
        run: pnpm localization:check
      - name: Check CSS variable names
        run: pnpm stylelint
      - name: Check generated protocol contracts
        run: pnpm typecheck:protocol
      - name: Check and test build tools
        if: matrix.surface == 'browser'
        run: |
          pnpm typecheck:build
          pnpm test:build
          pnpm build:stanza
      - name: Test frontend units
        if: matrix.surface == 'browser'
        run: pnpm test:unit
      - name: Install Chromium
        if: matrix.surface == 'browser'
        run: pnpm exec playwright install --with-deps chromium
      - name: Test browser integration
        if: matrix.surface == 'browser'
        run: pnpm run test:browser:integration --project=chromium
      - name: Prepare production browser UI smoke tests
        if: matrix.surface == 'browser'
        run: pnpm run pretest:smoke:browser
      - name: Test production browser UI
        if: matrix.surface == 'browser'
        run: pnpm run test:smoke:browser:no-compile
      - name: Prepare Electron UI smoke tests
        if: matrix.surface == 'electron'
        run: pnpm run pretest:smoke:ui
      - name: Test Electron UI
        if: matrix.surface == 'electron'
        run: pnpm run test:smoke:ui:no-compile
      - name: Prepare connected Web smoke tests
        if: matrix.surface == 'browser'
        run: pnpm run pretest:smoke:browser:full
      - name: Test connected Web
        if: matrix.surface == 'browser'
        run: pnpm run test:smoke:browser:full:no-compile
      - name: Prepare connected Electron smoke tests
        if: matrix.surface == 'electron'
        run: pnpm run pretest:smoke:desktop
      - name: Test connected Electron
        if: matrix.surface == 'electron'
        run: pnpm run smoketest-no-compile
      - name: Test Academic workbench
        if: matrix.surface == 'electron'
        run: pnpm exec playwright test test/smoke/areas/academic/academic-workbench.spec.ts --project=electron-ui
      - name: Test connected Academic document editing
        if: matrix.surface == 'electron'
        run: pnpm exec node test/smoke/run.ts electron-editor-app-server
      - name: Upload test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.surface }}-${{ matrix.runner }}
          path: .build/desktop/playwright/
          if-no-files-found: warn
