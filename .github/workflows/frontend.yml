name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "extension-sdk/**"
      - "localization/**"
      - "licenses/**"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "build/**"
      - "third_party/livekit/**"
      - "resources/**"
      - "extensions/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/actions/setup-frontend/**"
      - "scripts/install_python_tools.py"
      - "scripts/requirements.txt"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "extension-sdk/**"
      - "localization/**"
      - "licenses/**"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "build/**"
      - "third_party/livekit/**"
      - "resources/**"
      - "extensions/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/actions/setup-frontend/**"
      - "scripts/install_python_tools.py"
      - "scripts/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  # Finish main acceptance; newer runs replace only the pending main run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    uses: ./.github/workflows/frontend-tests.yml
    with:
      surface: browser
      runner: ubuntu-24.04
      shards: "[1]"
      shard-total: 1
  electron-windows:
    uses: ./.github/workflows/frontend-tests.yml
    with:
      surface: electron
      runner: windows-latest
      shards: "[1,2,3,4]"
      shard-total: 4
  electron-macos:
    uses: ./.github/workflows/frontend-tests.yml
    with:
      surface: electron
      runner: macos-26
      shards: "[1,2,3,4]"
      shard-total: 4
  browser-check:
    # Preserve the required check name and reject failed, skipped or cancelled shards.
    name: browser (ubuntu-24.04)
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all surface shards to pass
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
  electron-windows-check:
    # Preserve the required check name and reject failed, skipped or cancelled shards.
    name: electron (windows-latest)
    if: always()
    needs: electron-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all surface shards to pass
        env:
          RESULT: ${{ needs.electron-windows.result }}
        run: test "$RESULT" = success
  electron-macos-check:
    # Preserve the required check name and reject failed, skipped or cancelled shards.
    name: electron (macos-26)
    if: always()
    needs: electron-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all surface shards to pass
        env:
          RESULT: ${{ needs.electron-macos.result }}
        run: test "$RESULT" = success
