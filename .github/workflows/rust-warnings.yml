name: Rust warnings

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "ash-code/**/*.snap"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "scripts/cargo.py"
      - "scripts/just-shell.py"
      - "scripts/ci_impact.py"
      - "build/lib/ash_build/**"
      - "build/release/package/ripgrep.py"
      - "third_party/ripgrep/runtime-lock.json"
      - ".github/workflows/rust-warnings.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "ash-code/**/*.snap"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "scripts/cargo.py"
      - "scripts/just-shell.py"
      - "scripts/ci_impact.py"
      - "build/lib/ash_build/**"
      - "build/release/package/ripgrep.py"
      - "third_party/ripgrep/runtime-lock.json"
      - ".github/workflows/rust-warnings.yml"
  workflow_dispatch:

concurrency:
  group: rust-warnings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      tui: ${{ steps.impact.outputs.tui || steps.full.outputs.tui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: main
          list-files: json
          filters: |
            changed:
              - '**'
      - name: Select affected TUI tests
        if: github.event_name == 'pull_request'
        id: impact
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.changed_files }}
        run: python3 -B scripts/ci_impact.py
      - name: Run all TUI tests on main and manual dispatch
        if: github.event_name != 'pull_request'
        id: full
        run: echo 'tui=true' >> "$GITHUB_OUTPUT"

  warnings:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: python3
          - runner: macos-15
            python: python3
          - runner: windows-latest
            python: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Reject Rust workspace warnings, including tests
        shell: bash
        run: ${{ matrix.python }} -B scripts/cargo.py --deny-warnings check --workspace --all-targets --locked

  tui:
    name: TUI tests
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> .build/cargo"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            libcap-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Prepare locked ripgrep for local tests
        run: |
          python3 -B - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from build.lib.ash_build.targets import TARGETS
          from build.release.package.ripgrep import resolve_ripgrep

          root = Path.cwd()
          ripgrep = resolve_ripgrep(
              TARGETS["x86_64-unknown-linux-gnu"],
              root / "third_party/ripgrep/runtime-lock.json",
              root / "third_party/.cache/ripgrep",
          ).executable
          subprocess.run([ripgrep, "--version"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ASH_RG_PATH={ripgrep}\n")
          PY

      - name: Install Just for TUI test entrypoints
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: just@1.46.0

      - name: Test TUI interactions
        run: just test ash-tui

      - name: Test real TUI terminal scenarios
        run: just test-tui -- --test-threads=4

      - name: Test remote TUI reconnect
        run: just test ash-cli interactive_remote_tui_preserves_home_draft_after_transport_loss
