name: Desktop Electron runtime acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  acceptance:
    name: Desktop runtime (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The production packager compiles .icon assets with macOS 26's actool.
        runner: [windows-latest, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Behavioral CI uses unsigned bundles, not release credentials or publishing.
      ASH_UPDATE_PUBLIC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version-file: scripts/pyproject.toml
      - uses: ./.github/actions/setup-just
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ". -> .build/cargo"
          # Keep the verified input archives used to restore pruned native outputs.
          cache-directories: third_party/.cache/v8
          shared-key: desktop-runtime-${{ matrix.runner }}
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Sync locked tools and dependencies
        run: |
          python -B scripts/install_python_tools.py
          pnpm install --frozen-lockfile
      - name: Restore desktop addon artifacts
        id: desktop-addons
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .build/desktop-addons
          key: desktop-addons-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'build/desktop/addons.ts') }}
      - name: Install browser used to render Windows application icons
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Fetch locked Rust graph for offline build-script metadata
        # V8's include discovery reads Cargo metadata offline, including other targets.
        run: cargo fetch --locked
      - name: Revalidate V8 outputs after restoring the build cache
        # Cargo can consider V8 fresh while profile/gn_out was pruned from the cache.
        run: |
          cargo clean --package v8 --profile dev-small
          cargo clean --package v8 --profile ci-test
      - name: Build self-contained backend for Web and headless hosts
        run: pnpm run prepare:backend:web
      - name: Build Desktop backend with bundled media
        run: pnpm run prepare:backend
      - name: Select headless and Desktop runtime packages
        shell: bash
        run: |
          node --input-type=module -e "import {appendFileSync} from 'node:fs'; import {developmentAshPackagePath} from './build/desktop/runtimeStore.ts'; appendFileSync(process.env.GITHUB_ENV, 'ASH_ACCEPTANCE_RUNTIME_PACKAGE=' + developmentAshPackagePath(process.cwd(), 'packaged-node') + '\nASH_ACCEPTANCE_DESKTOP_BACKEND_PACKAGE=' + developmentAshPackagePath(process.cwd(), 'host-provided-node') + '\n');"
      - name: Build delivered Desktop bundle without standalone Node
        shell: bash
        run: |
          python -c 'import json, os, pathlib; source = json.loads((pathlib.Path(os.environ["ASH_ACCEPTANCE_DESKTOP_BACKEND_PACKAGE"]) / "ash-package.json").read_text()); output = pathlib.Path(".build/remote-acceptance-binding.json"); output.write_text(json.dumps({"schemaVersion": 1, "version": source["version"], "protocol": source["protocol"], "catalog": {"url": "https://github.com/chogng/ash/releases/download/acceptance-fixture/catalog.json", "sha256": "a" * 64}}))'
          export ASH_REMOTE_RELEASE_BINDING="$GITHUB_WORKSPACE/.build/remote-acceptance-binding.json"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm run package:win32:bundle --backend-package "$ASH_ACCEPTANCE_DESKTOP_BACKEND_PACKAGE" --output .build/desktop-runtime-ci
          else
            pnpm run package:darwin:bundle --unsigned --backend-package "$ASH_ACCEPTANCE_DESKTOP_BACKEND_PACKAGE" --output .build/desktop-runtime-ci
          fi
          node --input-type=module -e "import {appendFileSync,readFileSync} from 'node:fs'; import {resolve,join} from 'node:path'; const mac=process.platform==='darwin'; const bundle=resolve('.build/desktop-runtime-ci', mac ? 'Ash-darwin-'+process.arch+'/Ash.app' : 'Ash-win32-x64'); const electron=mac ? join(bundle,'Contents/MacOS/Ash') : join(bundle,'Ash.exe'); const version=JSON.parse(readFileSync('node_modules/electron/package.json','utf8')).version; appendFileSync(process.env.GITHUB_ENV, 'ASH_PACKAGED_BUNDLE='+bundle+'\nASH_TEST_ELECTRON_PATH='+electron+'\nASH_TEST_ELECTRON_VERSION='+version+'\n');"
      - name: Save verified desktop addon artifacts
        if: github.ref == 'refs/heads/main' && steps.desktop-addons.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .build/desktop-addons
          key: ${{ steps.desktop-addons.outputs.cache-primary-key }}
      - name: Check packaged automation types
        run: ./node_modules/bun/bin/bun.exe check -p test/automation/tsconfig.json --all
      - name: Verify real Desktop startup, quit, file and terminal operations
        run: pnpm run test:smoke:ui:no-compile test/smoke/areas/windows/packaged-app.spec.ts
      - name: Verify background, TUI restart, crash recovery, binding upgrade and rollback
        shell: bash
        run: python -B build/desktop/runtime_acceptance.py --bundle "$ASH_PACKAGED_BUNDLE" --standalone-package "$ASH_ACCEPTANCE_RUNTIME_PACKAGE" --report .build/desktop-runtime-acceptance.json
      - name: Test publication, daemon and capability contracts
        run: just test ash-app-server-daemon -p ash-package-store -p ash-lsp-server-provider -p ash-external-ext --lib --profile ci-test --locked
      - name: Verify real Electron language-server initialization and shutdown
        run: just test-processes ash-lsp-server-provider --test electron_runtime --profile ci-test --locked -- --ignored
      - name: Verify real Electron extensions retain separate window lifetimes
        run: just test ash-app-server --lib --profile ci-test --locked standard_extensions_keep_window_facts_callbacks_and_lifetimes_separate
      - name: Upload runtime and application diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runtime-${{ matrix.runner }}
          path: |
            .build/desktop-runtime-acceptance.json
            .build/desktop/playwright/
          if-no-files-found: warn
