name: Frontend tests

on:
  workflow_call:
    inputs:
      surface:
        required: true
        type: string
      runner:
        required: true
        type: string
      shards:
        required: true
        type: string
      shard-total:
        required: true
        type: number

permissions:
  contents: read

jobs:
  prepare-electron:
    name: Build Electron tests
    if: inputs.surface == 'electron'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-frontend
        id: setup
        with:
          backend-cache: "true"
      - name: Check localization sources
        run: pnpm localization:check
      - name: Check CSS variable names
        run: pnpm stylelint
      - name: Check generated protocol contracts
        run: pnpm typecheck:protocol
      - name: Prepare Electron UI smoke tests
        run: pnpm run pretest:smoke:ui
      - name: Prepare connected Electron smoke tests
        # UI preparation already built Desktop and checked automation types.
        if: steps.setup.outputs.backend-cache-hit != 'true'
        run: pnpm run prepare:backend
      - name: Select cached Electron backend
        if: steps.setup.outputs.backend-cache-hit == 'true'
        run: pnpm exec node build/python.ts -B build/desktop/develop.py --select-prepared
      - name: Archive prepared backend
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.backend-cache-hit != 'true'
        run: python -B build/desktop/ci.py --backend-only .build/ci/backend.tar.gz
      - name: Save prepared backend
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.backend-cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/ci/backend.tar.gz
          key: ${{ steps.setup.outputs.backend-cache-key }}
      - name: Archive Electron test build
        run: python -B build/desktop/ci.py .build/ci/electron.tar.gz
      - name: Upload Electron test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-build-${{ inputs.runner }}
          path: .build/ci/electron.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  browser:
    name: Browser tests
    if: inputs.surface == 'browser'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_LIST_PRINT_FAILURES_INLINE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-frontend
        with:
          browser: "true"
      - name: Check localization sources
        run: pnpm localization:check
      - name: Check CSS variable names
        run: pnpm stylelint
      - name: Check generated protocol contracts
        run: pnpm typecheck:protocol
      - name: Check and test build tools
        run: |
          pnpm typecheck:build
          pnpm test:build
          pnpm build:stanza
      - name: Test frontend units
        run: pnpm test:unit --jobs 4
      - name: Test browser integration
        run: pnpm run test:browser:integration --project=chromium
      - name: Prepare production browser UI smoke tests
        run: pnpm run pretest:smoke:browser
      - name: Test production browser UI
        run: pnpm run test:smoke:browser:no-compile
      - name: Prepare connected Web smoke tests
        run: pnpm run pretest:smoke:browser:full
      - name: Test connected Web
        run: pnpm run test:smoke:browser:full:no-compile
      - name: Upload test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-browser-${{ inputs.runner }}-1
          path: .build/desktop/playwright/
          if-no-files-found: warn
  test:
    name: ${{ matrix.suite }} shard ${{ matrix.shard }}/${{ inputs.shard-total }}
    needs: prepare-electron
    if: inputs.surface == 'electron'
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, connected]
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_LIST_PRINT_FAILURES_INLINE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-frontend
        with:
          build: "false"
      - name: Download Electron test build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-build-${{ inputs.runner }}
          path: .build/ci
      - name: Restore Electron test build
        run: |
          tar -xzf .build/ci/electron.tar.gz
          # Copy after extraction so tar never traverses pnpm's dependency links.
          node -e 'const fs = require("node:fs"); fs.mkdirSync("node_modules/native-keymap/build/Release", { recursive: true }); fs.copyFileSync(".build/ci/keymapping.node", "node_modules/native-keymap/build/Release/keymapping.node");'
          pnpm run prepare:output
          # Rebase the generation's resources and dependency links to this checkout.
          pnpm exec node build/python.ts -B build/desktop/develop.py --select-prepared
      - name: Test Electron UI
        if: matrix.suite == 'ui'
        run: pnpm run test:smoke:ui:no-compile --shard=${{ matrix.shard }}/${{ inputs.shard-total }}
      - name: Test connected Electron
        if: matrix.suite == 'connected'
        run: pnpm run smoketest-no-compile --shard=${{ matrix.shard }}/${{ inputs.shard-total }}
      - name: Test connected Academic document editing
        # This focused project has only two files; run it once to avoid empty shards.
        if: matrix.suite == 'connected' && matrix.shard == 1
        run: pnpm exec node test/smoke/run.ts electron-editor-app-server
      - name: Upload test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ inputs.surface }}-${{ inputs.runner }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: .build/desktop/playwright/
          if-no-files-found: warn
