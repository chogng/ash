[profile.dev]
# Keep line tables and backtraces without generating full variable debug information.
debug = "limited"
# Keep local Rust iteration incremental across repeated `cargo build` invocations.
incremental = true
opt-level = 1

[profile.dev.package.ash-app-server]
# The embedded App Server dominates unwind metadata in development builds.
opt-level = "s"

[profile.dev.package.ash-app-server-client]
# Keep the brokered client development graph small.
opt-level = "s"

[profile.test.package."*"]
# Large integration-test dependency graphs otherwise exceed macOS compact-unwind limits.
opt-level = 1

[profile.test.package.ash-tui]
# Keep TUI recompilation short in its unit tests and dependent CLI tests.
opt-level = 0

[profile.test.package.ash-app-server]
# Large App Server test binaries otherwise exceed macOS compact-unwind encoding limits.
opt-level = "s"

[profile.test.package.ash-app-server-client]
# Keep client integration tests debuggable while reducing generated unwind metadata.
opt-level = "s"

[profile.dev-small]
inherits = "dev"
debug = "none"
strip = "symbols"
# Fewer codegen units shorten a clean Code build without changing its unwind behavior.
codegen-units = 16

[profile.dev-small.package.ash-tui]
# TUI source edits recompile this crate on each local launch; dev-small is for development binaries.
codegen-units = 256
opt-level = 0

[profile.dev-small.package.ash-cli]
# Keep the dependent CLI rebuild short after a TUI edit.
codegen-units = 256

[profile.dev-small.package.ash-app-server]
# App Server source edits need the wider incremental partitioning as well.
codegen-units = 256

[profile.dev-small.package.ash-app-server-protocol]
# Development protocol builds spend substantial time optimizing generated Serde code.
opt-level = 0

[profile.dev-small.package.ash-protocol]
opt-level = 0

[profile.ci-test]
# Inherit test optimization: unoptimized workspace code makes the linked services
# exceed macOS's 16 MiB DWARF unwind offset limit. Keep the TUI's package override.
inherits = "test"
debug = "limited"

[workspace.lints.rust]
unsafe_code = "forbid"
