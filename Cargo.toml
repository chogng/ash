[profile.dev]
# Keep line tables and backtraces without generating full variable debug information.
debug = "limited"
# Keep local Rust iteration incremental across repeated `cargo build` invocations.
incremental = true
opt-level = 1

[profile.dev.package.app]
# Keep the native product's unwind metadata below macOS compact-unwind encoding limits.
opt-level = "s"

[profile.dev.package.ash-app-server]
# The embedded App Server dominates native unwind metadata in development builds.
opt-level = "s"

[profile.dev.package.ash-app-server-client]
# Keep the brokered client small enough to coexist with the native product graph.
opt-level = "s"

[profile.test.package."*"]
# Large integration-test dependency graphs otherwise exceed macOS compact-unwind limits.
opt-level = 1

[profile.test.package.ash-app-server]
# Large App Server test binaries otherwise exceed macOS compact-unwind encoding limits.
opt-level = "s"

[profile.test.package.ash-app-server-client]
# Keep client integration tests debuggable while reducing generated unwind metadata.
opt-level = "s"

[profile.dev-small]
inherits = "dev"
debug = "none"
strip = "symbols"

[profile.ci-test]
# Reduce binary size and disk pressure in CI test builds.
inherits = "test"
opt-level = 0
debug = "limited"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
candle-onnx = { path = "third_party/candle-onnx" }

[patch."https://github.com/microsoft/mxc"]
mxc_engine = { path = "ash-rs/vendor/mxc/core/mxc_engine" }
wxc_common = { path = "ash-rs/vendor/mxc/core/wxc_common" }
appcontainer_common = { path = "ash-rs/vendor/mxc/backends/appcontainer/common" }
bwrap_common = { path = "ash-rs/vendor/mxc/backends/bubblewrap/common" }
seatbelt_common = { path = "ash-rs/vendor/mxc/backends/seatbelt/common" }
