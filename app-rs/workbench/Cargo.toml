[package]
name = "ash-workbench"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_workbench"
path = "lib.rs"

[dependencies]
ash-utils-home-dir = { workspace = true }
memories = { workspace = true }
message-history = { workspace = true }
state = { package = "ash-state", path = "../../ash-rs/state" }
ash-memory-diagnostics = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
ash-app-server-client = { workspace = true }
ash-app-server-daemon = { workspace = true }
ash-app-server-protocol = { workspace = true }
ash-commands = { workspace = true }
ash-diff = { workspace = true }
ash-editor = { workspace = true }
ash-editor-host = { workspace = true }
ash-files = { workspace = true }
ash-icons = { workspace = true }
ash-keybinding = { workspace = true }
ash-keybindings-host = { workspace = true }
ash-lsp-manager = { workspace = true }
ash-protocol = { workspace = true }
ash-remote = { workspace = true }
ash-remote-connections = { workspace = true }
ash-remote-host = { workspace = true }
ash-session = { workspace = true }
ash-settings = { workspace = true }
ash-scm = { workspace = true }
arg0 = { workspace = true }
ash-terminal = { workspace = true }
ash-terminal-runtime = { workspace = true }
ash-text-file = { workspace = true }
ash-ui-components = { workspace = true }
ash-ui-theme = { workspace = true }
zui = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true

[dev-dependencies]
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
ash-diff = { workspace = true }
ash-text-file = { workspace = true }
