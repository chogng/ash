[package]
name = "zui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "zui"
path = "src/lib.rs"

[[bin]]
name = "zui-packager"
path = "tools/zui_packager.rs"
required-features = ["native"]

[[bin]]
name = "zui-appcontainer-runner"
path = "tools/zui_appcontainer_runner.rs"
required-features = ["native"]

[features]
default = ["wgpu"]
native = [
    "dep:accesskit",
    "dep:accesskit-platform",
    "dep:arboard",
    "dep:ashpd",
    "dep:block2",
    "dep:core-graphics",
    "dep:dirs",
    "dep:futures",
    "dep:fs2",
    "dep:global-hotkey",
    "dep:gio",
    "dep:gtk",
    "dep:icon-loader",
    "dep:muda",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:open",
    "dep:raw-window-handle",
    "dep:rfd",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tray-icon",
    "dep:tokio",
    "dep:unic-langid",
    "dep:url",
    "dep:ureq",
    "dep:winit",
    "dep:windows",
    "dep:windows-sys",
    "dep:uds_windows",
    "dep:x11rb",
    "dep:zbus",
    "dep:ash-product-update",
]
wgpu = [
    "native",
    "dep:bytemuck",
    "dep:glyphon",
    "dep:pollster",
    "dep:resvg",
    "dep:wgpu",
]

[dependencies]
accesskit = { workspace = true, optional = true }
accesskit-platform = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
cosmic-text = { workspace = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true, features = ["thread-pool"] }
fs2 = { workspace = true, optional = true }
global-hotkey = { workspace = true, optional = true }
glyphon = { workspace = true, optional = true }
open = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sys-locale = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
unic-langid = { workspace = true, optional = true }
url = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
ash-product-update = { workspace = true, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
core-graphics = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = ["NSApplication", "NSBitmapImageRep", "NSDockTile", "NSDocumentController", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSScreen", "NSWorkspace"] }
objc2-foundation = { workspace = true, optional = true, features = ["block2", "NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSError", "NSJSONSerialization", "NSLocale", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "NSUserActivity"] }
tray-icon = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
muda = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
uds_windows = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { workspace = true, optional = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true, features = ["global_shortcuts", "tokio"] }
gio = { workspace = true, optional = true }
gtk = { workspace = true, optional = true }
icon-loader = { workspace = true, optional = true }
muda = { workspace = true, optional = true, features = ["gtk"] }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync"] }
tray-icon = { workspace = true, optional = true, features = ["gtk"] }
x11rb = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[lints.rust]
# Win32 AppContainer integration is isolated to modules that opt into unsafe code. The crate root
# denies unsafe code everywhere else.
unsafe_code = "allow"

[dev-dependencies]
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
ash-product-update = { workspace = true, features = ["signing"] }

[target.'cfg(unix)'.dev-dependencies]
ashpd = { workspace = true, features = ["global_shortcuts", "tokio"] }
