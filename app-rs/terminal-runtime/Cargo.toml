[package]
name = "ash-terminal-runtime"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_terminal_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
unicode-width = { workspace = true }
ash-app-server-client = { workspace = true }
ash-app-server-protocol = { workspace = true }
ash-protocol = { workspace = true }
ash-remote-connections = { workspace = true }
ash-terminal = { workspace = true }
ash-ui-components = { workspace = true }
ash-ui-theme = { workspace = true }
ash-utils-pty = { workspace = true }
zui = { workspace = true, features = ["native"] }

[lints]
workspace = true
