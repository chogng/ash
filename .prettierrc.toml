printWidth = 80
tabWidth = 2
useTabs = false
proseWrap = "preserve"
endOfLine = "lf"
# Code examples keep the formatting rules of their owning language.
embeddedLanguageFormatting = "off"

[[overrides]]
files = ["tsfmt.json", ".vscode/*.json", ".vscode/*.jsonc", "**/*.css", "**/*.html"]
[overrides.options]
useTabs = true
tabWidth = 4
