printWidth = 80
tabWidth = 2
useTabs = false
proseWrap = "preserve"
endOfLine = "lf"
# Code examples keep the formatting rules of their owning language.
embeddedLanguageFormatting = "off"

[[overrides]]
files = [".vscode/*.json", ".vscode/*.jsonc", "**/*.css", "**/*.html"]
[overrides.options]
useTabs = true
tabWidth = 4

[[overrides]]
files = ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"]
[overrides.options]
printWidth = 200
useTabs = true
tabWidth = 4
singleQuote = true
trailingComma = "all"
arrowParens = "avoid"
objectWrap = "preserve"
