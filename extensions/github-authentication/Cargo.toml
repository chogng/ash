[package]
name = "ash-github-authentication"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "github_authentication"

[[bin]]
name = "ash-github-authentication"
path = "src/main.rs"

[dependencies]
external-ext-sdk = { package = "ash-external-ext-sdk", path = "../../sdk/rust" }
github.workspace = true
ash-http-client.workspace = true
ash-async-utils.workspace = true
ash-login.workspace = true
ash-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
zeroize.workspace = true
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true

[dev-dependencies]
external-ext-protocol.workspace = true
ash-external-ext.workspace = true
ash-install-context.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# tests/runtime.rs includes the production App Server adapter by path, whose
# host/protocol imports are invisible to cargo-shear's source-file discovery.
ignored = ["ash-external-ext", "external-ext-protocol"]
