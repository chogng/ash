[package]
name = "ash-dev-container-provider"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "dev_container_provider"

[[bin]]
name = "ash-dev-container-provider"
path = "src/main.rs"

[dependencies]
external-ext-sdk = { package = "ash-external-ext-sdk", path = "../../sdk/rust" }
ash-protocol.workspace = true
ash-remote.workspace = true
ash-remote-connections.workspace = true
ash-install-context.workspace = true
ash-sandboxing.workspace = true
serde.workspace = true
serde_json.workspace = true
dunce.workspace = true

[dev-dependencies]
tempfile.workspace = true
ash-external-ext.workspace = true
external-ext-protocol.workspace = true
ash-core-plugins.workspace = true
ash-async-utils.workspace = true
ash-utils-path.workspace = true
sha2.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# tests/host.rs compiles the product consumer adapter by path against the real executable.
ignored = ["ash-external-ext", "external-ext-protocol", "ash-utils-path", "sha2"]
