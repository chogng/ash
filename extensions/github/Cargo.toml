[package]
name = "ash-github-extension"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "github_extension"

[[bin]]
name = "ash-github-extension"
path = "src/main.rs"

[dependencies]
github.workspace = true
external-ext-sdk = { package = "ash-external-ext-sdk", path = "../../sdk/rust" }
base64.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
ash-http-client.workspace = true
ash-async-utils.workspace = true
ash-login.workspace = true
ash-secrets.workspace = true

[dev-dependencies]
sha2.workspace = true
ash-external-ext.workspace = true
external-ext-protocol.workspace = true
ash-core-plugins.workspace = true
ash-install-context.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# runtime.rs compiles the product adapter by path; these imports are outside this package.
ignored = ["ash-install-context", "external-ext-protocol", "sha2"]
