<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding integration</title>
    <style>
      :root {
        --ash-foreground: #111;
        --ash-editor-background: #fff;
        --ash-widget-border: #777;
        --ash-focusBorder: #165dba;
        --ash-strokeThickness: 1px;
        --ash-cornerRadius-small: 4px;
        --ash-cornerRadius-large: 8px;
        --ash-spacing-size80: 8px;
        --ash-spacing-size120: 12px;
        --ash-spacing-size160: 16px;
        --ash-fontSize-heading3: 13px;
        --ash-fontSize-body1: 13px;
        --ash-fontWeight-semiBold: 600;
      }
      body { margin: 0; }
      main { position: relative; width: 100vw; height: 100vh; }
      #previous { position: absolute; top: 24px; left: 24px; }
      #first { position: absolute; top: 100px; left: 80px; }
      #second { position: absolute; top: 160px; left: 350px; }
    </style>
  </head>
  <body>
    <main>
      <button id="previous">Previous focus</button>
      <button id="first">First target</button>
      <button id="second">Second target</button>
    </main>
    <script type="module" src="./onboarding.integration.ts"></script>
  </body>
</html>
