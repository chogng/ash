[package]
name = "ash-app-server-test-client"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "app_server_test_client"
doctest = false

[dependencies]
anyhow = { workspace = true }
app-server-protocol = { package = "ash-app-server-protocol", path = "../app-server-protocol" }
app-server-transport = { package = "ash-app-server-transport", path = "../app-server-transport" }
clap = { workspace = true, features = ["derive", "env"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "signal"] }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "cli"
harness = false

[lints]
workspace = true
