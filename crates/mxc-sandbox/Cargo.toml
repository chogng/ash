[package]
name = "ash-mxc-sandbox"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "mxc_sandbox"
doctest = false

[dependencies]
mxc-sdk = { workspace = true }
log = { workspace = true }
ash-utils-pty = { workspace = true }
dunce = { workspace = true }
ash-install-context = { workspace = true }
ash-sandboxing = { workspace = true }
ash-file-access = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
ash-file-identity = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
ash-protocol = { workspace = true }
ash-tool-executor = { workspace = true }
ash-async-utils = { workspace = true }
network-proxy = { workspace = true, features = ["server"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = { workspace = true }
test-binary-support = { workspace = true }

# The library forbids unsafe code. Only the macOS test binary's syscall module
# may override this deny to exercise the platform ABI directly.
[lints.rust]
unsafe_code = "deny"

[[test]]
name = "pty"
harness = false
