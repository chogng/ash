[package]
name = "ash-app-server-daemon"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "ash-app-server-daemon"
path = "src/main.rs"

[lib]
doctest = false
name = "ash_app_server_daemon"
path = "src/lib.rs"

[dependencies]
exec-server-protocol = { workspace = true }
ash-utils-home-dir = { workspace = true }
remote = { package = "ash-remote", path = "../remote" }
signal-hook = { workspace = true }
ash-install-context = { workspace = true }
process-hardening = { workspace = true }
build-info = { workspace = true }
dunce = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
ash-app-server-protocol = { workspace = true }
ash-app-server-transport = { workspace = true }
ash-package-store = { workspace = true }
ash-product-update = { workspace = true }
ash-uds = { workspace = true }
flate2 = { workspace = true }
semver = { workspace = true }
tar = { workspace = true }
ureq-update = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
sha2 = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "deny"
