[package]
name = "ash-keyring-store"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_keyring_store"
path = "src/lib.rs"

[dependencies]
keyring = { workspace = true, features = ["crypto-rust"] }
sha2 = { workspace = true }
ash-secrets = { path = "../secrets" }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep keyring's existing entry/attribute contract while avoiding its old zbus backend.
# Bundle libdbus so standalone products do not acquire a new shared-library requirement.
keyring = { workspace = true, features = ["linux-native-sync-persistent", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
security-framework = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
