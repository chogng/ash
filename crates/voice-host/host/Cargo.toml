[package]
name = "ash-audio-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "ash-voice-host"
path = "src/main.rs"
required-features = ["host"]

[features]
host = ["dep:cpal", "dep:crossbeam-queue", "dep:rubato", "dep:sonora"]

[lints]
workspace = true

[dependencies]
ash-package-store.workspace = true
cpal = { workspace = true, optional = true }
crossbeam-queue = { workspace = true, optional = true }
process-hardening.workspace = true
rubato = { workspace = true, optional = true }
serde_json.workspace = true
sonora = { workspace = true, optional = true }
voice-host = { package = "ash-voice-host", path = ".." }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[[test]]
name = "process"
required-features = ["host"]
