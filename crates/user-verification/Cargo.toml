[package]
name = "ash-user-verification"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_user_verification"
path = "src/lib.rs"

[lints.rust]
# Platform keystore and biometric authentication FFI are isolated in this crate.
unsafe_code = "allow"

[dependencies]
base64 = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
dirs = { workspace = true }
objc2-06 = { workspace = true }
objc2-foundation-03 = { workspace = true, default-features = false, features = ["std", "NSString"] }
objc2-local-authentication = { workspace = true, default-features = false, features = ["std", "LAContext", "LABiometryType"] }
security-framework = { workspace = true, features = ["OSX_10_15"] }
security-framework-sys = { workspace = true }

[dev-dependencies]
p256 = { workspace = true, features = ["ecdsa"], default-features = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
