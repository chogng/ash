[package]
name = "ash-rmcp-client"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_rmcp_client"
path = "src/lib.rs"

[dependencies]
ash-utils-pty = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "reqwest-tls-no-provider",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
ash-http-client = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
sse-stream = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
