[package]
name = "ash-v8-runtime"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "v8_runtime"

[dependencies]
deno_core_icudata.workspace = true
v8 = { workspace = true, features = ["v8_enable_sandbox"] }

[build-dependencies]
cc.workspace = true
serde_json.workspace = true

[lints.rust]
# This crate owns the linked V8 sandbox probe at the engine FFI boundary.
unsafe_code = "allow"
