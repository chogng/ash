[package]
name = "ash-file-system"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_file_system"
path = "src/lib.rs"

[dependencies]
ash-async-utils = { workspace = true }
ec4rs = { workspace = true }
cap-std = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
ash-file-access = { workspace = true }
ash-file-identity = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { workspace = true }
x11rb = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
clipboard-win = { workspace = true, features = ["std"] }

[lints.rust]
# Windows replacement preserves the target ACL through a narrowly scoped Win32 call.
unsafe_code = "deny"
