[package]
name = "ash-screen-capture"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "screen_capture"
path = "src/screen_capture.rs"

[features]
default = []

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# The crate root denies unsafe internally and allows it only in the audited platform FFI module.
unsafe_code = "allow"
