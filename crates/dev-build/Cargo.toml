[package]
name = "ash-dev-build"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "ash-build"
path = "src/main.rs"
required-features = ["compiler"]

[features]
compiler = ["dep:proc-macro2", "dep:quote", "dep:syn2", "dep:toml", "dep:ash-rust-build-ir", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-object", "dep:object"]

[lib]
doctest = false

[dependencies]
libloading = { workspace = true }
memmap2 = { workspace = true }
ash-rust-build-ir = { path = "../rust-build-ir", optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
object = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, features = ["span-locations"], optional = true }
syn2 = { workspace = true, features = ["full", "visit"], optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
# Native loading and the C ABI buffer boundary are isolated in this crate.
unsafe_code = "allow"
