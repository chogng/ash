[package]
name = "ash-app-server-protocol"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_app_server_protocol"
path = "src/lib.rs"

[features]
json-schema = ["dep:schemars", "slash-commands/json-schema", "extension-protocol/json-schema"]
export = ["json-schema", "dep:sha2", "dep:ts-rs", "slash-commands/export", "extension-protocol/export"]

[[bin]]
name = "generate_protocol"
path = "src/bin/generate_protocol.rs"
required-features = ["export"]

[dependencies]
extension-protocol = { workspace = true }
slash-commands = { package = "ash-slash-commands", path = "../slash-commands" }
noop-macros = { package = "ash-app-server-protocol-noop-macros", path = "../app-server-protocol-noop-macros" }
call = { package = "ash-call-contract", path = "../call-contract" }
response-debug-context = { workspace = true }
memories = { workspace = true }
guardian-environment = { workspace = true }
extension-items = { workspace = true }
queue = { package = "ash-queue-contract", path = "../queue-contract" }
task-delivery = { package = "ash-task-delivery-contract", path = "../task-delivery-contract" }
build-info = { workspace = true }
analytics = { workspace = true }
diagnostics = { workspace = true }
feedback-contract = { workspace = true }
features = { workspace = true }
ash-memory-diagnostics = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
ts-rs = { workspace = true, features = ["no-serde-warnings"], optional = true }
url = { workspace = true }
zeroize = { workspace = true }
ash-protocol = { workspace = true }
ash-environment = { workspace = true }
ash-file-access = { workspace = true }
collaboration = { package = "ash-collaboration-contract", path = "../collaboration-contract" }
ash-thread-transcript = { workspace = true }
ash-utils-path-uri = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
extension-protocol = { workspace = true, features = ["export"] }
slash-commands = { package = "ash-slash-commands", path = "../slash-commands", features = ["export"] }
sha2 = { workspace = true }
schemars = { workspace = true }
ts-rs = { workspace = true, features = ["no-serde-warnings"] }

[lints]
workspace = true
