[package]
build = "build.rs"
name = "ash-bwrap"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "bwrap"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
cc = { workspace = true }
pkg-config = { workspace = true }

[lints.rust]
# This executable is the narrow FFI boundary to Bubblewrap's upstream C entry point.
unsafe_code = "allow"
