[package]
name = "ash-voice-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "voice_host"

[[bin]]
name = "ash-voice-host"
required-features = ["host"]

[features]
default = []
host = ["dep:cpal", "dep:crossbeam-queue", "dep:rubato", "dep:sonora", "dep:process-hardening"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
thiserror = { workspace = true }
cpal = { workspace = true, optional = true }
crossbeam-queue = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
sonora = { workspace = true, optional = true }
process-hardening = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "process"
required-features = ["host"]
