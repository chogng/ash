[package]
name = "ash-git"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_git"
path = "src/lib.rs"

[dependencies]
dunce = { workspace = true }
futures = { workspace = true }
install-context = { package = "ash-install-context", path = "../install-context" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
ash-diff = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
pty = { package = "ash-utils-pty", path = "../utils/pty" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
