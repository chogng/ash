[package]
name = "ash-utils-pty"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_utils_pty"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
filedescriptor = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
shared_library = { workspace = true }
winapi = { workspace = true, features = ["handleapi", "namedpipeapi", "jobapi2", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# This systems crate is the only local exception to the workspace unsafe ban:
# its PTY and ConPTY implementation requires audited platform FFI.
[lints.rust]
unsafe_code = "allow"
