[package]
name = "ash-js-extension-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "ash-js-extension-host"
path = "src/main.rs"

[dependencies]
extension-protocol.workspace = true
serde_json.workspace = true
serde.workspace = true
v8-runtime.workspace = true
v8 = { workspace = true, features = ["v8_enable_sandbox"] }

[dev-dependencies]
host = { package = "ash-editor-extension-host", path = "../editor-extension-host" }
ash-file-system.workspace = true
ash-file-access.workspace = true
tempfile.workspace = true

[lints.rust]
# Module resolution and heap-limit callbacks enter V8's FFI scopes; execution stays in this process.
unsafe_code = "allow"
