name = "ash_state"
path = "src/lib.rs"

[dependencies]
assets = { workspace = true }
attachment-store = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
async-utils = { package = "ash-async-utils", path = "../async-utils" }
agent-graph-store = { workspace = true }
message-history = { workspace = true }
memories = { workspace = true }
guardian-environment = { workspace = true }
github = { workspace = true }
fs2 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ash-history = { workspace = true }
ash-protocol = { workspace = true }
ash-projects = { workspace = true }
ash-teams = { workspace = true }
ash-thread-store = { workspace = true }
git-turn-changes = { workspace = true }
ash-utils-path = { workspace = true }
ash-file-access = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
image = { workspace = true, features = ["jpeg", "webp"] }
core-api = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
