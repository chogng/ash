[package]
name = "ash-app-server-client"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Product hosts connect to a separate server process; embedding is used by contract tests.
in-process = ["dep:ash-app-server", "dep:ash-client"]

[lib]
doctest = false
name = "ash_app_server_client"
path = "src/lib.rs"

[dependencies]
memories = { workspace = true }
queue = { workspace = true }
diagnostics = { workspace = true }
feedback-contract = { workspace = true }
base64 = { workspace = true }
ash-memory-diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
ash-app-server = { workspace = true, optional = true }
ash-app-server-protocol = { workspace = true }
ash-app-server-transport = { workspace = true }
ash-client = { workspace = true, optional = true }
[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
ash-utils-pty = { workspace = true }

[dev-dependencies]
ash-app-server = { workspace = true }
ash-client = { workspace = true }
ash-protocol = { workspace = true }
core-api = { workspace = true }
ash-async-utils = { workspace = true }
ash-core = { workspace = true }
