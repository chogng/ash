[package]
name = "ash-exec"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_exec"
path = "src/lib.rs"

[features]
# Schema generation is an explicit tooling capability; product builds only need Serde.
schema = ["dep:schemars", "ash-app-server-protocol/json-schema"]

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ash-app-server-client = { workspace = true }
ash-app-server-protocol = { workspace = true }
ash-async-utils = { workspace = true }
ash-protocol = { workspace = true }

[lints]
workspace = true
