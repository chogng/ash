[package]
name = "ash-mxc-sandbox"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "mxc_sandbox"
doctest = false

[dependencies]
log = { workspace = true }
wxc_common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ash-utils-pty = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
dunce = { workspace = true }
ash-install-context = { workspace = true }
ash-sandboxing = { workspace = true }
ash-file-access = { workspace = true }

[target.'cfg(windows)'.dependencies]
appcontainer_common = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bwrap_common = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
seatbelt_common = { workspace = true }

[dev-dependencies]
test-binary-support = { workspace = true }
libtest-mimic = { workspace = true }
ash-protocol = { workspace = true }
ash-tool-executor = { workspace = true }
ash-async-utils = { workspace = true }
network-proxy = { workspace = true, features = ["server"] }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "pty"
harness = false
