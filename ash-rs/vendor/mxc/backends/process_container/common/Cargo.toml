[package]
name = "appcontainer_common"
version = "0.8.0"
edition = "2021"
license = "MIT"

[features]
force-tier-testing = []
tier2_bfs = []

[dependencies]
wxc_common = { "path" = "../../../core/wxc_common" }
serde = { "version" = "1", "features" = ["derive"] }
serde_json = { "version" = "1" }
thiserror = { "version" = "2" }
getrandom = { "version" = "0.2" }

[target."cfg(target_os = \"windows\")".dependencies]
windows = { "version" = "0.62", "features" = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
windows-core = { "version" = "0.62" }
flatbuffers = { "version" = "25" }
process_security_environment_spec = { "git" = "https://github.com/microsoft/mxc", "rev" = "ca7ea12ac6bd9f5420d6adecb37e32a8158da476" }
widestring = { "version" = "1" }
winreg = { "version" = "0.55" }
learning_mode_windows = { "git" = "https://github.com/microsoft/mxc", "rev" = "ca7ea12ac6bd9f5420d6adecb37e32a8158da476" }
learning_mode_core = { "git" = "https://github.com/microsoft/mxc", "rev" = "ca7ea12ac6bd9f5420d6adecb37e32a8158da476" }

[dev-dependencies]
learning_mode_windows = { git = "https://github.com/microsoft/mxc", rev = "ca7ea12ac6bd9f5420d6adecb37e32a8158da476", features = ["test-support"] }
tempfile = { "version" = "3" }
