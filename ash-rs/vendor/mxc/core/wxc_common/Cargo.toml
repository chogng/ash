[package]
"name" = "wxc_common"
"version" = "0.9.0"
"edition" = "2021"
"license" = "MIT"

[features]
"microvm" = ["dep:nanvix_common", "dep:uuid"]
"test-support" = []

[dependencies]
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "features" = ["raw_value"] }
"serde_path_to_error" = { "version" = "0.1" }
"sha2" = { "version" = "0.11" }
"unicode-general-category" = { "version" = "1" }
"thiserror" = { "version" = "2" }
"base64" = { "version" = "0.22" }
"cidr" = { "version" = "0.3.2" }
"url" = { "version" = "2" }
"getrandom" = { "version" = "0.2" }
"nanvix_common" = { "optional" = true, "git" = "https://github.com/microsoft/mxc", "rev" = "46ce71d0da7b97bb531a33e175bf4166ffa730c0" }
"uuid" = { "version" = "1", "features" = ["v4"], "optional" = true }
"mxc_config_contract" = { "git" = "https://github.com/microsoft/mxc", "rev" = "46ce71d0da7b97bb531a33e175bf4166ffa730c0" }
"mxc_telemetry" = { "git" = "https://github.com/microsoft/mxc", "rev" = "46ce71d0da7b97bb531a33e175bf4166ffa730c0" }

[target."cfg(target_os = \"windows\")".dependencies]
"windows" = { "version" = "0.62", "features" = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_Globalization"] }
"windows-core" = { "version" = "0.62" }
"widestring" = { "version" = "1" }
"winreg" = { "version" = "0.55" }

[target."cfg(unix)".dependencies]
"libc" = { "version" = "0.2" }

[dev-dependencies]
"filetime" = "0.2"
"tempfile" = { "version" = "3" }

[build-dependencies]
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "features" = ["raw_value"] }
