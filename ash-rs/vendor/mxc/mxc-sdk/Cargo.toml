[package]
name = "mxc-sdk"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Importable library for starting MXC sandboxes in-process, with streaming stdio."
repository = "https://github.com/microsoft/mxc"
readme = "README.md"
build = "build.rs"
autobins = false

[lib]
name = "mxc_sdk"
path = "src/lib.rs"

[[bin]]
name = "wxc-windows-sandbox-daemon"
path = "src/bin/windows_sandbox_daemon/portable_main.rs"

[[bin]]
name = "wxc-windows-sandbox-guest"
path = "src/bin/windows_sandbox_guest/portable_main.rs"

[[bin]]
name = "wxc-wslc-daemon"
path = "src/bin/wslc_daemon/main.rs"
required-features = ["wslc"]

[features]
default = []
wslc = ["link-wslcsdk", "dep:libloading", "dep:tar"]
link-wslcsdk = ["dep:zip"]
isolation_session = ["dep:windows-collections", "dep:windows-future"]
test-support = []
microvm = []
hyperlight = [
    "dep:hyperlight-unikraft",
    "dep:ureq",
    "dep:flate2",
    "dep:tar",
]
force-tier-testing = []
tier2_bfs = []
schema-gen = ["dep:schemars"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cidr = "0.3.2"
flatbuffers = "25"
getrandom = "0.2"
libc = "0.2"
libloading = { version = "0.8", optional = true }
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "net", "process", "user", "term"] }
same-file = "1"
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tar = { version = "0.4", optional = true }
unicode-general-category = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
widestring = "1"
[build-dependencies]
# Bazel resolves these tools for the build host; only the Windows build script
# uses them. Keeping them here makes the same SDK build through both consumers.
cc = "1"
winresource = { version = "0.1.31", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
filetime = "0.2"
quick-xml = "0.41"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
[target.'cfg(target_arch = "x86_64")'.dependencies]
flate2 = { version = "1", optional = true }
hyperlight-unikraft = { version = "=0.17.0", default-features = false, optional = true }
ureq = { version = "3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
tracelogging = "1.2"
windows = { version = "0.62", features = ["Foundation", "UI", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
windows-collections = { version = "0.3", optional = true }
windows-core = "0.62"
windows-future = { version = "0.3", optional = true }
winreg = "0.55"

[[example]]
name = "isolation_session_console"
required-features = ["isolation_session"]

[[example]]
name = "sta_probe"
required-features = ["isolation_session"]
