<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; font-src https://cdn.jsdelivr.net; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mermaid</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1.5rem; }
    main { max-width: 96rem; margin: auto; }
    .mermaid { overflow: auto; }
    details { margin-top: 1.5rem; }
    summary { cursor: pointer; }
    summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    details pre { overflow: auto; padding: 1rem; border: 1px solid currentColor; white-space: pre; }
  </style>
</head>
<body>
  <main>
    <h1>Mermaid</h1>
    <pre class="mermaid"><!--MERMAID_SOURCE--></pre>
    <details><summary id="source-label">Mermaid source</summary><pre><!--MERMAID_SOURCE--></pre></details>
  </main>
  <script type="module">
    const language = navigator.language.toLowerCase();
    const labels = {
      ja: 'Mermaid のソース',
      zh: 'Mermaid 源码',
      fr: 'Code source Mermaid',
    };
    const match = Object.keys(labels).find((key) => language.startsWith(key));
    if (match) {
      document.getElementById('source-label').textContent = labels[match];
      document.documentElement.lang = match;
    }
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs');
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
    });
    const diagram = document.querySelector('.mermaid');
    const { svg, bindFunctions } = await mermaid.render('ash-mermaid-preview', diagram.textContent);
    diagram.innerHTML = svg;
    bindFunctions?.(diagram);
  </script>
</body>
</html>
