[package]
name = "ash-tui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "ash_tui"
path = "src/lib.rs"

[dependencies]
features = { workspace = true }
ash-utils-home-dir = { workspace = true }
ash-utils-absolute-path = { workspace = true }
memories = { workspace = true }
queue = { workspace = true }
message-history = { workspace = true }
state = { package = "ash-state", path = "../../ash-rs/state" }
base64 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
pulldown-cmark = { workspace = true }
mermaid = { workspace = true }
ratatui = { workspace = true, features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
syntect = { workspace = true }
ash-memory-diagnostics = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
ash-ansi-escape = { workspace = true }
ash-app-server-client = { workspace = true }
ash-app-server-protocol = { workspace = true }
ash-file-search = { workspace = true }
ash-file-access = { workspace = true }
ash-keybinding = { workspace = true }
ash-protocol = { workspace = true }
ash-product-update = { workspace = true }
ash-slash-commands = { workspace = true }
ash-sprite = { workspace = true }
ash-terminal-detection = { workspace = true }
ash-utils-elapsed = { workspace = true }
ash-utils-image = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "stdio"] }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
ash-app-server-client = { workspace = true, features = ["in-process"] }
insta = { workspace = true }
tempfile = { workspace = true }
ash-client = { workspace = true }

[build-dependencies]
ash-sprite = { workspace = true, features = ["rust-source", "sheet"] }

[lints.rust]
# Keep unsafe code denied outside the explicitly scoped Windows console adapter.
unsafe_code = "deny"
