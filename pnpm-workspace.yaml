packages:
  - build
  - extensions/markdown-language-features
  - test/scenario
engineStrict: true
allowBuilds:
  bun: true
  electron: true
  esbuild: true
  native-keymap: true
  native-is-elevated: false
  sharp: true
  unrs-resolver: true
  workerd: true

# The Markdown language service runs in a browser Worker; picomatch 4 has no Node-only imports.
overrides:
  # Keep the Markdown formula renderer on the GHSA-238p-pmpm-9mq7 fixed release.
  katex: 0.18.2
  vscode-markdown-languageservice>picomatch: ^4.0.5
