packages:
  - build
  - extensions/markdown-language-features
  - test/scenario
engineStrict: true
allowBuilds:
  electron: true
  esbuild: true
  native-keymap: true
  native-is-elevated: false
  sharp: true
  unrs-resolver: true
  workerd: true

# The Markdown language service runs in a browser Worker; picomatch 4 has no Node-only imports.
overrides:
  vscode-markdown-languageservice>picomatch: ^4.0.5
