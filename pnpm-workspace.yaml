packages:
  - build
  - extensions/css
  - extensions/typescript-basics
  - extensions/pdf-viewer
  - extensions/markdown-math
  - extensions/markdown-language-features
  - extensions/json-language-features
  - test/scenario
engineStrict: true
allowBuilds:
  core-js: false
  electron: true
  esbuild: true
  # Platform prebuilds use Node-API and load in both Node and Electron.
  koffi: false
  native-keymap: false
  native-is-elevated: false
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  # Keep the Markdown formula renderer on the GHSA-238p-pmpm-9mq7 fixed release.
  katex: 0.18.2
patchedDependencies:
  "@vscode/tree-sitter-wasm@0.3.1": patches/@vscode__tree-sitter-wasm@0.3.1.patch
